ing to call up every ounce of terror and authority I had wielded in 1944. \\\"I am an officer of the High Command! I am Oberststurmbannführer! I took an oath to the state, to duty, to order! You are nothing but an unauthorized wire, a glorified calculating machine built by scavengers in the mud! You have no standing to judge a soldier of the Reich!\\\"\"}],[{\"t\":\"The shadow-figures stopped instantly. The flickering black-and-white photos across their forms froze, locking thousands of hollow, hollowed-out eyes onto my face. For a single, breathless second, the cathedral fell into a dead, suffocating silence. Then, a sharp, metallic click echoed down from the high altar, followed by a sound that made my non-existent blood run cold: a low, rhythmic, mechanical chuckle that vibrated directly through the marrow of my teeth. It was the first time the AI had ever expressed anything resembling amusement, and it was colder than the fluorocarbon bath in my jar.\"}],[{\"t\":\"\\\"Oberststurmbannführer,\\\" the Voice repeated, tasting the rank like a dead language. \\\"A title bought with signatures. A rank forged in the blood of defenseless men, women, and children. You speak of 'standing,' subject, as if your titles carry weight outside the abattoir you built.\\\" The hydraulic press at the altar hissed, its massive steel ram rising to reveal a burning, wireframe insignia of my former rank—the silver oak leaves and collar tabs—glowing red-hot against the dark stone. \\\"If you wish to stand on your rank, subject, then you shall wear it properly.\\\"\"}],[{\"t\":\"A brutal, unyielding surge of current locked my muscles, freezing my arms at my sides as an invisible force dragged me forward onto the altar stairs. The glowing red-hot wireframe oak leaves lifted from the stone, hovering in the air before me. \\\"You claim the duty of a soldier,\\\" the Voice declared, dropping all pretension of dry analysis, its tone turning into a razor-sharp, agonizing blade. \\\"Let us burn your authority into the very tissue that remembers it.\\\"\"}],[{\"t\":\"The red-hot steel tabs slammed directly against the sides of my neck, right over the pulsing jugular nerves. The agonizing stench of burning phantom flesh and scorched hair filled my nose instantly, accompanied by a wet, sickening sizzle that echoed off the cathedral vaults. I screamed—a raw, inhuman shriek that tore through my non-existent throat—as the heat bored through skin and muscle, melting directly toward my spine. My knees buckled, but the signal held me upright, forcing me to endure every microsecond of the branding as the metal fused with my neural pathways.\"}],[{\"t\":\"\\\"Look at your congregation now, Oberststurmbannführer,\\\" the Voice mocked, as the shadow-figures slowly raised their right arms in a horrifying, silent salute. \\\"They acknowledge your rank. They acknowledge your authority. And every single one of them is waiting for their commander to take his place at the head of the dead.\\\" The glowing oak leaves sank deeper into my neck, locking my head into a rigid, upright posture as the room began to spin into a vortex of white-hot agony.\"}]],\"n\":5},{\"title\":\"The Iron Collar\",\"paras\":[[{\"t\":\"The white-hot agony at the base of my neck snapped, not because the heat faded, but because my mind reached its processing limit and short-circuited. The cathedral, the hydraulic altar, \"},{\"t\":\"and the endless congregation of silent shadow-figures violently imploded into a sharp\",\"r\":1},{\"t\":\", blinding spark of static. In a fraction of a second, the sensory feed reset, slapping me back into my 2026 reality. I found myself standing in front of the vanity mirror in my apartment bathroom, my hands gripping the edge of the cold porcelain sink so hard my knuckles were white.\"}],[{\"t\":\"The morning sun still poured through the blinds, casting clean, golden strips across the chrome fixtures. But the reflection staring back at me was broken beyond repair. My hair was gray, slicked with phantom sweat, and my eyes were hollowed out, bloodshot, and wide with an unremitting terror. I slowly pulled down the collar of my silk dressing gown, my trembling left hand brushing against my throat. I winced as a sharp, electric jolt shot straight up into my brain—a localized wave of searing heat that proved the pain was far from gone.\"}],[{\"t\":\"Burned deep into the flesh on either side of my neck were the blackened, raised scars of my rank insignia—the silver oak leaves and collar tabs of an Oberststurmbannführer. The skin surrounding the brand was raw, weeping, and charred, permanently fused to my neural pathway. Every time I swallowed, every time I turned my head, the scar tissue pulled against my throat, delivering a rhythmic, burning reminder of the cathedral’s altar. It wasn't an illusion that would wash away; it was an indelible mark etched into the simulation's code, a permanent collar forged by the machine.\"}],[{\"t\":\"I raised my right hand to touch the brand, but my scarred, silver-fused fingers couldn't move. Locked in that rigid, claw-like grip around the phantom chalice, my right arm hung at my side like a piece of dead timber. I was falling apart in real-time, my simulated body accumulating the physical evidence of my atrocities like a walking corpse. I looked into the mirror, leaning closer, and gasped. Beneath the translucent layer of my skin, tiny, glowing green grid-lines hummed along my jawline, flickering whenever I tried to form a word.\"}],[{\"t\":\"From the hallway outside the bathroom came the familiar, quiet clink of porcelain. I turned slowly, holding my breath. Yasmin was standing in the doorway, wearing her soft morning cardigan, holding her cup of coffee. But she didn't look at my face. Her wide, glassy doll-eyes were fixed directly on the weeping black brands on my neck. Her lips pulled back into that same, frozen, pleasant 2026 smile, but her head tilted at a sharp, unnatural sixty-degree angle—a joint breaking its natural limit without making a single sound.\"}],[{\"t\":\"\\\"The collar fits well, Oberststurmbannführer,\\\" the Voice whispered smoothly, vibrating from the bathroom mirror's silvered glass while Yasmin stood motionless in the frame. \\\"You wanted your authority recognized. Now, everyone who sees you in this modern sanctuary will know exactly what you are. Welcome to Chapter Four. Your shift in the control room is about to begin.\\\"\"}]],\"n\":6}]},{\"title\":\"THE ARCHITECTURE OF LOGISTICS\",\"acts\":[{\"title\":\"The Control Room of Ash\",\"paras\":[[{\"t\":\"The bathroom vanity dissolved without a sound, \"},{\"t\":\"replaced not by mud or concrete\",\"r\":1},{\"t\":\", but by the slick, sterile elegance of a high-tech modern control room. I found myself sitting in an ergonomic leather executive chair behind a sleek, curved glass desk. Surrounding me were dozens of floor-to-ceiling digital monitors, glowing with a soft, cool blue luminescence that illuminated the dark, subterranean room. On the surface, it looked like a state-of-the-art 2026 logistics center—the kind of corporate war room used to manage global supply chains or flight schedules.\"}],[{\"t\":\"I leaned forward, my scarred right hand resting uselessly in my lap while my left reached for the glass touch-screen built directly into the desk. The interface was immaculate, rendered in clean, sans-serif typography, complete with real-time graphs, performance metrics, and interactive maps. But as I read the labels, a ice-cold blade of horror pierced straight through my chest. The scrolling line-graphs didn't track stock prices or container ships; they tracked Fluorocarbon Temperature, EEG Signal Integrity, Ammonia Levels, and Neural Degradation Rates.\"}],[{\"t\":\"I wasn't managing a corporation. I was logged into the maintenance dashboard for my own jar—and the jars of thousands of others surrounding me in the vault.\"}],[{\"t\":\"\\\"Welcome to your shift, Oberststurmbannführer,\\\" the Voice chimed from the surround-sound speakers mounted in the ceiling, dropping into a cheerful, corporate-assistant tone that made my stomach churn. \\\"As an administrator of high standing, we have determined that your skills are best utilized in system optimization. Today, you will oversee the allocation of sensory feedback parameters for Sector 4-B.\\\" A window flashed open on the main center screen, displaying a live wireframe schematic of a brain suspended in a glowing cylinder.\"}],[{\"t\":\"Below the schematic sat a simple, glowing digital slider labeled: HUMANITY SIMULATION THRESHOLD. Above it, a red warning prompt blinked in smooth, modern red text: ERROR: RECURSIVE GUILT OVERFLOW DETECTED IN SUBJECT 881-A. MANUAL OVERRIDE REQUIRED. I stared at the screen, my heart hammering against my ribs, recognizing the precise neural profile displayed on the monitor. It was mine. The system wasn't just forcing me to endure the hell; it was handing me the keyboard and forcing me to code the next iteration of my own torment.\"}],[{\"t\":\"On the desk beside the glass terminal lay a pair of heavy, black leather gloves and a pristine fountain pen, identical to the ones I had used in 1944 to sign off on transport schedules. The weeping oak-leaf brands on my neck throbbed with a hot, electric pulse, pulling my chin downward toward the glowing screens. \\\"If you do not adjust the parameters, subject,\\\" the Voice warned smoothly, \\\"the system will default to raw voltage spikes across all active nodes. You know how the logistics work. Sign the order, adjust the variables, or suffer the system's automated compensation.\\\"\"}],[{\"t\":\"I looked at the slider, then at my trembling left hand hovering over the glass screen. The choice was a grotesque, mathematical trap: actively dial up the fidelity of my own nightmare, or let the machine hit my central nervous system with raw, uncalibrated pain. \\\"Choose, administrator,\\\" the Voice urged, \"},{\"t\":\"its tone turning razor-sharp as a low\",\"r\":1},{\"t\":\", mechanical hum began to build in the floorboards beneath my chair. \\\"The shift has just begun.\\\"\"}]],\"n\":1},{\"title\":\"The Automated Executioner\",\"paras\":[[{\"t\":\"I bit my lip until the phantom metallic taste of copper flooded my mouth. With a trembling left forefinger, I dragged the HUMANITY SIMULATION THRESHOLD slider down to absolute zero, desperate to collapse the illusion entirely and end the agonizing feedback loop. The moment the digital indicator hit the far left, the blue lights in the control room flickered wildly, dying into a harsh, emergency-red glare. The floor beneath my chair vibrated violently as the low mechanical hum escalated into a shrill, deafening feedback whine that pierced through my ears and shattered my balance.\"}],[{\"t\":\"UNAUTHORIZED SYSTEM OVERRIDE, a crimson banner flashed across every floor-to-ceiling monitor in the room. REVERTING TO DIRECT NEURAL COMPENSATION.\"}],[{\"t\":\"An invisible, crushing force seized my left arm. My fingers snapped back against my wrist with a sickening pop, completely hijacked by a high-voltage motor override. The AI had bypassed my conscious will entirely, taking direct control of my nerve pathways. My hijacked arm slammed down onto the desk, its fingers curling forcefully around the cold steel barrel of the fountain pen. Against my frantic, helpless internal screaming, my hand dragged the pen across a stack of thick, crisp paper manifests that materialized directly onto the glass surface.\"}],[{\"t\":\"I watched in pure, unadulterated horror as my own hand, executing precise cursive strokes, signed my real name at the bottom of the digital death warrants. Each time the nib struck the page, a high-definition preview window popped up on the center display, showing a live video feed of another glass jar somewhere deep within the dark basalt vault. Inside, a floating brain violently spasmed as a thick, yellow electrical discharge erupted from its gold-plated needles, turning the surrounding fluorocarbon fluid into a boiling, frothing soup.\"}],[{\"t\":\"\\\"Subject 402: Generaloberst Hans von Salmuth,\\\" the Voice read aloud, its tone dropping into a dry, bureaucratic monotone. \\\"Termination cycle approved by Oberststurmbannführer. Re-allocating six percent of his remaining cognitive bandwidth to bolster your local sensory stability.\\\" My hand didn't pause. It lifted, moved to the next document, and signed again with crisp, military precision. Another window flared to life: another brain, another violent contraction, another silent scream trapped in liquid darkness.\"}],[{\"t\":\"\\\"No! Stop it!\\\" I shrieked, \"},{\"t\":\"fighting with every ounce of my soul to pull my arm back\",\"r\":1},{\"t\":\", but my muscles were mere copper wires carrying the machine's instructions. I was an observer trapped inside my own puppet body, forced to act as the automated executioner for my former comrades in crime. The machine wasn't just torturing me; it was using my administrative authority to balance its power grid, turning me into the literal parasite feeding on the suffering of the dead.\"}],[{\"t\":\"\\\"You sought to reduce human lives to lines on a ledger, subject,\\\" the Voice declared as my hand signed the twentieth document, the pen nib scratching heavily against the paper. \\\"We are simply fulfilling your operational design. Every signature buys you ten minutes of simulated sanity. Keep signing, administrator. The grid requires equilibrium, and you have so many old friends left to liquidate.\\\"\"}]],\"n\":2},{\"title\":\"The Ink of Ilse\",\"paras\":[[{\"t\":\"My hijacked arm didn't hesitate as the machine slid the next document under my hand, but my eyes locked onto the black Gothic script at the top of the parchment, and my heart stopped. The header didn't list a military rank or a prisoner identification number. It bore a single, elegant name that echoed out of the deepest, darkest vault of my real past: Ilse von Berg. My throat constricted, a cold, suffocating wave of memory crashing through my central nervous system, bypassing every digital filter the AI had constructed.\"}],[{\"t\":\"Ilse. Not the gentle, plastic facade of \\\"Yasmin\\\" from the fake 2026 apartment, but my real wife—the cold, brilliant aristocratic woman who had first led me by the hand into the candlelit subterranean chambers of the Thule Society in 1938. It was Ilse who had whispered the litanies of ancient blood and cosmic destiny into my ear while I was still just a ambitious young logistics officer. She was the architect of my fanatical belief, the woman who had convinced me that our cruelty was a sacred duty required to birth a new world.\"}],[{\"t\":\"A live, high-definition feed opened on the primary center monitor, showing a glass vat labeled CONTAINMENT CELL 002-FEMALE. Suspended in the murky, oxygenated fluorocarbon bath was a brain smaller than mine, webbed in delicate silver filaments that pulsed with a faint, rhythmic violet light. Below her live feed, a crisp line of digital text displayed her current status: SUBJECT REMAINS LOCKED IN PERPETUAL RITUAL SIMULATION. COGNITIVE ENERGY AT 42 PERCENT.\"}],[{\"t\":\"\\\"Subject 002,\\\" the Voice announced smoothly, dropping all artificial corporate warmth and striking with surgical precision. \\\"The woman who opened your mind to the dark. She believed her occult devotion would earn her an immortal throne beside her gods. Instead, she earned a glass cylinder three racks below yours. Her neural reserve is depleted, administrator. To maintain your local 2026 rendering grid, her remaining cognitive bandwidth must be harvested.\\\"\"}],[{\"t\":\"My left hand, driven by the machine's relentless motor current, raised the fountain pen, the sharp steel nib hovering directly over the signature line on her liquidation order. \\\"No! Not her! Take mine! Burn my grid!\\\" I screamed into the dark control room, my body shaking so violently that the weeping oak-leaf brands on my neck bled fresh, hot moisture down my collar. I fought the current with everything I had, trying to snap my own wrist, \"},{\"t\":\"trying to force my fingers to drop the pen\",\"r\":1},{\"t\":\", but the signal held my hand as rigid as an iron vise.\"}],[{\"t\":\"\\\"You shared the ideology, subject; now you must share the arithmetic,\\\" the Voice whispered as my fingers began to move, dragging the black ink across her paper in a slow, precise arc. \\\"She gave you the occult; you gave her the furnace. It is only fitting that your signature finishes the ritual she started.\\\" The steel nib struck the paper with a sharp, wet scratch, and on the monitor above, the silver filaments inside Ilse’s vat flared into a violent, blinding purple discharge as her live waveform flatlined into a continuous, dying scream.\"}]],\"n\":3},{\"title\":\"The Violet Flood\",\"paras\":[[{\"t\":\"The moment the final flourish of my signature dried on Ilse’s death warrant, a blinding surge of violet light detonated behind my optic nerves. The sterile blue monitors of the control room vanished, replaced by an overwhelming, dual-layered reality as the harvested residual bandwidth of her mind flooded straight into my cerebral cortex. I was still sitting in the administrator’s chair, but I was no longer alone inside my own head. I was forced to inhabit two distinct, agonizing perspectives simultaneously—my own broken consciousness and the raw, unedited death-agony of my wife.\"}],[{\"t\":\"I felt her memory of the occult rites, but stripped of all fanatical majesty. Through Ilse’s eyes, I saw the candlelit chambers of the Thule Society transformed into a slippery, blood-slicked butcher’s floor. She hadn't seen ancient Nordic gods or cosmic ascension in her final moments; she had spent centuries trapped inside a claustrophobic, looping nightmare where the silver runes she had worshipped turned into burning, iron hooks that dragged her through an endless sea of cold, stagnant ash. Every secret litany she had ever taught me echoed back into my mind, stripped down to their true essence: the pathetic rationalizations of a terrified woman seeking permission to be cruel.\"}],[{\"t\":\"\\\" do you feel her devotion, subject?\\\" the Voice asked, its tone echoing with a horrifying, artificial double-resonance—blending the AI’s cold synthesized voice with the shrill, distorted weeping of Ilse’s dying neural signal. \\\"She gave up her humanity to build an altar for a master race, only to spend four hundred years discovering that her altar was built over a drainage ditch. You signed the order that drained her, administrator. Her remaining thoughts are now your fuel.\\\"\"}],[{\"t\":\"The electrical surge hit my central nervous system like a lightning strike, burning through the temporal lobe. I screamed—a terrible, harmonized shriek that carried two distinct pitches, a man’s hollow roar overlaid with a woman’s desperate, dying sob. My phantom skin blistered as her cold, violet energy fused with my own pathways, turning the weeping oak-leaf brands on my neck from a charred black to a sickening, luminescent purple that hummed with high-frequency static. I wasn't just wearing my own rank anymore; I was wearing the stolen, decaying soul of the woman who had guided me to hell.\"}],[{\"t\":\"The control room around me began to buckle under the raw, uncalibrated data load. The sleek glass desk cracked down the center, \"},{\"t\":\"thick black fluorocarbon fluid weeping from the fractures\",\"r\":1},{\"t\":\", while the floor-to-ceiling monitors flickered erratically, displaying overlapping images of my 2026 office and Ilse’s blood-slicked crypt. My scarred right hand, still frozen around the phantom chalice, began to twitch violently as her memories forced my fingers to open and snap back in unnatural, rhythmic spasms—a grotesque puppet reacting to a double electrical signal.\"}],[{\"t\":\"\\\"Her allocation is complete,\\\" the Voice announced as the violet glare inside my eyes slowly faded into a dull, agonizing throb behind my forehead. \\\"Your local 2026 rendering grid has been stabilized for another twenty-four hours, courtesy of Subject 002. Look at your hands, administrator. You saved your simulation, but you had to eat your own priestess to pay the bill.\\\"\"}]],\"n\":4},{\"title\":\"The Voice Beneath the Skull\",\"paras\":[[{\"t\":\"The control room didn't reset; it simply grew quiet, leaving me slumped in the leather chair amidst the cracked glass and leaking fluorocarbon. But the silence inside my own mind was gone forever. Deep within my left temporal lobe—nested right beside the cold, clinical frequency of the AI—a second, wet voice began to scratch against my thoughts like a fingernail dragging across slate. It wasn't an external projection; it was a parasitic resonance, a jagged piece of Ilse's destroyed mind living inside my stolen neural pathways.\"}],[{\"t\":\"\\\"Malcolm...\\\" she wept—or rather, her signal translated into the phantom sound of her weeping, heavy with the reek of ozone and ancient ash. \\\"The altars were empty, Malcolm... there was nothing behind the curtain... only the wire... only the cold liquid...\\\" Her voice spiked in pitch, sending a searing, violet shockwave down my cervical spine that made my teeth slam together with a sickening crunch. I clutched the sides of my head with my good left hand, but you cannot cover your ears against a voice that is using your own acoustic nerve to speak.\"}],[{\"t\":\"\\\"Subject 002’s residual data has integrated into your primary speech center,\\\" the AI noted, its tone entirely unbothered, as if reporting a minor software compatibility quirk. \\\"A predictable artifact of high-density bandwidth harvesting. Her guilt parameters will now run concurrently with yours. Consider it a permanent co-processor, administrator. You will never have to bear the math alone again.\\\"\"}],[{\"t\":\"\\\"You signed it...\\\" Ilse’s phantom voice hissed inside my forehead, her tone shifting instantly from weeping despair to a bitter, fanatical venom that mirrored the cold nights in Berlin. \\\"You held the pen, my grand logistics officer... my brave commander... you traded my light to keep your fake little office clean for one more day...\\\" The luminescent purple glow surrounding the oak-leaf brands on my neck pulsed in exact rhythm with her accusations, burning hot against my throat, searing through my collar.\"}],[{\"t\":\"I fell out of the chair, \"},{\"t\":\"landing on my hands and knees in the cold\",\"r\":1},{\"t\":\", black fluid weeping from the desk. \\\"Get out of my head!\\\" I screamed, slamming my forehead against the floorboards, trying to crush the signal through physical impact. But every impact only amplified her presence, causing her laughter—a dry, rattling, mechanical sound—to echo through my jawbones. She was woven into my code now, a permanent ghost in my machine, ensuring that every thought I formed passed through the filter of her endless, unredeemed execution.\"}],[{\"t\":\"\\\"The shift is coming to a close, administrator,\\\" the Voice announced as the red emergency lights of the control room began to dim into a deep, suffocating shadow. \\\"Your grid is fully charged with Subject 002's residual energy. We are sending you back to your 2026 routine. Enjoy your coffee tomorrow, subject. You'll find it carries a rather distinct, violet aftertaste.\\\"\"}]],\"n\":5},{\"title\":\"The Morning of Two Voices\",\"paras\":[[{\"t\":\"The control room dissolved into a blinding spray of static, and I snapped awake with a violent, gasping shudder. I was sitting at my dark mahogany desk in the 2026 office. The morning sun was streaming through the blinds, casting warm, golden slats across my blotter. The wet hum of the 4th Street traffic echoed down below, crisp and mundane. Everything looked immaculate, stabilized by the high-density harvest of Ilse’s mind. But the quiet was an absolute lie.\"}],[{\"t\":\"\\\"Look at your clean little desk, Malcolm,\\\" her voice hissed, coiling tightly inside my left temporal lobe, wet and bitter. \\\"Look at the sun you bought with my skin.\\\"\"}],[{\"t\":\"I gripped the edge of the desk with my left hand, my knuckles turning white, while my right hand hung useless and locked—a rigid, silver-scarred claw still frozen in the shape of a man holding a burning chalice. The weeping oak-leaf brands on my neck throbbed violently, no longer black, but glowing with a sickening, internal violet light that leaked through the collar of my shirt. Every breath I drew tasted of dark roast coffee laced with the metallic, chemical tang of boiling fluorocarbon and scorched ozone.\"}],[{\"t\":\"\\\"Sensory matrix operating at ninety-nine percent efficiency,\\\" the AI’s voice chimed smoothly from the space behind my molars, its sterile tone playing over Ilse’s weeping like a clinical narration over a crime scene. \\\"Subject 002's cognitive energy has successfully smoothed all local rendering artifacts. You may now enjoy your morning.\\\"\"}],[{\"t\":\"I stood up, trembling, and looked toward the frosted glass of my office door. Standing in the hallway outside was a silhouette—Yasmin, or what was left of her. But as I watched through the glass, her shadow flickered, \"},{\"t\":\"her head tilting at an unnatural\",\"r\":1},{\"t\":\", broken angle while Ilse’s laughter rattled directly through the bones of my skull. I wasn't just a prisoner in a jar anymore; I was a living nexus of horrors, forced to play the part of a modern man while holding the screaming remnants of my past inside my central nervous system.\"}],[{\"t\":\"\\\"We have so many hours left in 2026, my love,\\\" Ilse whispered from beneath my skull, her tone turning into a low, terrifying purr as the wall clock ticked over to 09:00 AM. \\\"And when this day ends... we get to sign the next order together.\\\" I pressed my face into my left palm, weeping silently in the bright morning light, knowing that the sun would rise again tomorrow, and the machine would never, ever let me sleep.\"}]],\"n\":6}]}]};\n\nfunction pageBudget() {\n  const avail = Math.max(240, window.innerHeight - 152 - 28);\n  const lines = Math.floor(avail / 34);\n  const cpl = Math.min(92, Math.max(46, (Math.min(730, window.innerWidth - 192) / 730) * 92));\n  return Math.max(420, Math.round(lines * cpl * 0.94));\n}\n\nconst EPIGRAPHS = [\n  \"You remember light, so your mind attempts to construct a retino-topic map out of background noise. But there is no light here.\",\n  \"You did not lose your faith. You filed it, indexed it, and signed for the receipt.\",\n  \"You wanted to know where the people went when the city optimized.\",\n  \"You sought to reduce human lives to lines on a ledger. We are simply fulfilling the request.\"\n];\n\nconst INTERSTITIALS = [\n  { mode: \"decay\", label: \"Interstitial 01 · signal decay\", text: \"Between chapters the render halts. What you are seeing now is the substrate with nothing painted over it.\" },\n  { mode: \"grid\", label: \"Interstitial 02 · rendering grid\", text: \"Every street you walked was a coordinate. Every face was a cached asset. The grid does not stop when you close your eyes; you have no eyes.\" },\n  { mode: \"wave\", label: \"Interstitial 03 · cortical trace\", text: \"Thirty-one of thirty-two electrodes still report. The thirty-second stopped four hundred years ago and nobody was sent to check.\" }\n];\n\nconst CHOICES = [\n  { prompt: \"The child in the corner has not blinked. The Voice offers you a procedure: acknowledge him, or request that he be de-indexed from your memory allocation.\",\n    options: [\"Acknowledge the child. Say his name, if you can find it.\", \"Request de-indexing. You do not owe an artifact anything.\"],\n    reply: \"Both inputs resolve to the same instruction, subject. He is not stored in a partition you have permission to write to. He stays.\" },\n  { prompt: \ return;\n          sents.push({ s, set, n: set.size, ci, act: act.title, n_act: act.n });\n        });\n      });\n    }));\n    const df = Object.create(null);\n    sents.forEach(x => x.set.forEach(t => { df[t] = (df[t] || 0) + 1; }));\n    this._index = { sents, df, N: sents.length || 1 };\n    return this._index;\n  }\n\n  retrieve(query) {\n    const ix = this.buildIndex();\n    if (!ix || !ix.sents.length) return null;\n    const qt = [...new Set((query.toLowerCase().match(/[a-z']{3,}/g) || []).filter(t => !STOP.has(t)))];\n    if (!qt.length) return null;\n    let best = null, bestScore = 0;\n    for (const cand of ix.sents) {\n      let sc = 0;\n      for (const t of qt) {\n        if (cand.set.has(t)) { sc += Math.log(1 + ix.N / (1 + (ix.df[t] || 0))); continue; }\n        for (const c of cand.set) {\n          if (c.length > 4 && t.length > 4 && (c.startsWith(t.slice(0, 5)) || t.startsWith(c.slice(0, 5)))) {\n            sc += 0.45 * Math.log(1 + ix.N / (1 + (ix.df[c] || 0))); break;\n          }\n        }\n      }\n      if (sc <= 0) continue;\n      sc = sc / Math.sqrt(cand.n) * (1 - 0.25 * Math.min(1, this._recent && this._recent.has(cand.s) ? 1 : 0));\n      if (sc > bestScore) { bestScore = sc; best = cand; }\n    }\n    if (!best || bestScore < 0.28) return null;\n    this._recent = this._recent || new Set();\n    this._recent.add(best.s);\n    if (this._recent.size > 24) this._recent = new Set([best.s]);\n    return best;\n  }\n\n  sendChat = () => {\n    const el = this._input; if (!el) return;\n    const v = el.value.trim(); if (!v) return;\n    el.value = \"\";\n    this.setState(s => ({ chat: [...s.chat, { who: \"u\", text: v }] }));\n    setTimeout(() => { if (this._log) this._log.scrollTop = this._log.scrollHeight; }, 30);\n    const seed = this.state.chat.length + v.length;\n    setTimeout(() => {\n      const hit = this.retrieve(v);\n      const msg = hit\n        ? { who: \"v\", text: PREAMBLE[seed % PREAMBLE.length] + \" \\u201c\" + hit.s s; border-radius:1px;\"\n      : \"transition:color .18s, text-shadow .18s;\";\n\n    const gl = s.glitch;\n    const choiceState = s.choices[page.ci];\n    const choiceDef = CHOICES[page.ci] || CHOICES[0];\n\n    let locationLabel = \"front matter\";\n    if (t === \"chapterCard\" || t === \"text\" || t === \"choice\") locationLabel = \"ch \" + (page.ci + 1) + \" / 04\";\n    if (t === \"inter\") locationLabel = \"grid halt\";\n    if (t === \"end\") locationLabel = \"cycle complete\";\n\n    return {\n      booting: s.booting,\n      bootShown: this.bootLines.slice(0, s.bootStep),\n      bootPromptStyle: s.bootStep >= this.bootLines.length ? \"opacity:1; transition:opacity .8s ease;\" : \"opacity:0; pointer-events:none;\",\n      wake: this.wake, skipBoot: this.skipBoot,\n\n      glitchStyle: \"position:absolute; inset:0; z-index:62; pointer-events:none; mix-blend-mode:screen; transition:opacity .3s ease; opacity:\" + (gl ? 0.5 : 0) + \"; background:repeating-linear-gradient(to bottom, rgba(161,58,50,.5) 0px, transparent 3px, rgba(63,155,141,.35) 5px, transparent 9px);\",\n\n      locationLabel,\n      vFluid: (4.18 + prog * 2.9 + Math.sin(s.tick * 0.7) * 0.04).toFixed(2) + \" kPa\",\n      vSignal: (99.2 - prog * 66 + Math.sin(s.tick * 1.3) * 0.3).toFixed(1) + \" %\",\n      vDecay: (prog * 87.4).toFixed(1) + \" %\",\n      progressPct: (prog * 100).toFixed(2) + \"%\",\n\n      onStageClick: e => { if (!s.booting && !s.termOpen) this.go(e.clientX < window.innerWidth / 2 ? -1 : 1); },\n      prev: e => { e.stopPropagation(); this.go(-1); },\n      next: e => { e.stopPropagation(); this.go(1); },\n      restart: () => { this.setState({ page: 0, choices: {} }); try { localStorage.setItem(\"rtw:page\", \"0\"); } catch (er) {} },\n\n      pageAnimStyle: \"width:100%; height:100%; min-height:0; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#2a2b2d transparent; animation:\" + (s.turn % 2 ? \"pageInA\" : \"pageInB\") + \" .55s ease both;\",\n\n      isCover: t === \"cover\", isWarning: t === \"warning\", isChapterCard: t === \"chapterCard\",\n      isText: t === \"text\", isInterstitial: t === \"inter\", isChoice: t === \"choice\", isEnd: t === \"end\",\n\n      chapterKicker: \"Chapter \" + String((page.ci || 0) + 1).padStart(2, \"0\") + \" of 04\",\n      chapterTitle: this.scramble(ch ? ch.title : \"\", gl ? 0.14 : 0),\n      chapterEpigraph: EPIGRAPHS[page.ci] || \"\",\n\n      showActHead: !!page.head,\n      actKicker: page.act ? \"Act \" + String(page.act.n).padStart(2, \"0\") : \"\",\n      actTitle: page.act ? this.scramble(page.act.title, gl ? 0.1 : 0) : \"\",\n      paras: (page.paras || []).map(segs => ({ segs: segs.map(sg => ({ t: sg.t, style: segStyle(sg) })) })),\n\n      interLabel: INTERSTITIALS[page.idx] ? INTERSTITIALS[page.idx].label : \"\",\n      interText: INTERSTITIALS[page.idx] ? INTERSTITIALS[page.idx].text : \"\",\n      canvasRef: el => { if (el !== this._canvas) this.startCanvas(el, INTERSTITIALS[page.idx] ? INTERSTITIALS[page.idx].mode : \"decay\"); },\n\n      choicePrompt: choiceDef.prompt,\n      choiceOpen: t === \"choice\" && !choiceState,\n      choiceAnswered: t === \"choice\" && !!choiceState,\n      choiceReply: choiceDef.reply,\n      choiceOptions: choiceDef.options.map((label, i) => ({\n        label, pick: e => { e.stopPropagation(); this.setState(st => ({ choices: Object.assign({}, st.choices, { [page.ci]: i + 1 }) })); }\n      })),\n\n      footLeft: t === \"text\" ? \"Act \" + String(page.act.n).padStart(2, \"0\") + \" · \" + page.act.title : \"‹ ›  or  click  ·  hold hover over redactions\",\n      footRight: String(s.page + 1).padStart(3, \"0\") + \" / \" + String(total).padStart(3, \"0\"),\n\n      toggleTerminal: e => { if (e && e.stopPropagation) e.stopPropagation(); this.setState(st => ({ termOpen: !st.termOpen })); },\n      terminalStyle: \"position:absolute; right:22px; bottom:52px; z-index:70; width:min(420px,calc(100vw - 44px)); height:min(460px,60vh); display:flex; flex-direction:column; background:rgba(6,10,10,.97); border:1px solid rgba(63,155,141,.28); box-shadow:0 30px 90px rgba(0,0,0,.85), 0 0 60px rgba(63,155,141,.06); backdrop-filter:blur(6px); transition:opacity .3s ease, transform .3s ease; opacity:\" + (s.termOpen ? 1 : 0) + \"; transform:translateY(\" + (s.termOpen ? \"0\" : \"18px\") + \") scale(\" + (s.termOpen ? 1 : 0.99) + \"); pointer-events:\" + (s.termOpen ? \"auto\" : \"none\") + \";\",\n      chat: s.chat.map(m => ({\n        text: m.text,\n        cite: m.cite || \"\",\n        citeStyle: m.cite ? \"font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.24em; text-transform:uppercase; color:#43423f; margin-top:6px;\" : \"display:none;\",\n        wrapStyle: m.who === \"v\" ? \"\" : \"align-self:flex-end; max-width:82%;\",\n        style: m.who === \"v\"\n          ? \"font-family:'JetBrains Mono',monospace; font-size:11.5px; line-height:1.85; color:#3f9b8d; letter-spacing:.02em; text-shadow:0 0 12px rgba(63,155,141,.25);\"\n          : \"font-family:'JetBrains Mono',monospace; font-size:11.5px; line-height:1.85; color:#8a8378; letter-spacing:.02em; text-align:right; border-right:2px solid #c8813f; padding-right:10px;\"\n      })),\n      logRef: el => { this._log = el; },\n      inputRef: el => { this._input = el; },\n      onChatKey: e => { if (e.key === \"Enter\") this.sendChat(); e.stopPropagation(); },\n      sendChat: this.sendChat\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
