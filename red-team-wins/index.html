  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 paras }}\" as=\"para\" hint-placeholder-count=\"3\">\n            <p style=\"font-family:Spectral,serif; font-weight:300; font-size:17.5px; line-height:1.95; color:#c4bdb1; margin:0 0 27px; text-wrap:pretty; text-align:justify; hyphens:auto;\">\n              <sc-for list=\"{{ para.segs }}\" as=\"seg\" hint-placeholder-count=\"1\">\n                <span style=\"{{ seg.style }}\" style-hover=\"color:#efe7d8; background:transparent; box-shadow:none; text-shadow:0 0 14px rgba(200,129,63,.45);\">{{ seg.t }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fp>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isInterstitial }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"width:100%; max-width:880px; margin:0 auto; text-align:center;\">\n          <div style=\"position:relative; width:100%; height:min(46vh,420px); border:1px solid rgba(255,255,255,.07); background:#050608; overflow:hidden;\">\n            <canvas ref=\"{{ canvasRef }}\" style=\"position:absolute; inset:0; width:100%; height:100%; display:block;\"><\u002Fcanvas>\n            <div style=\"position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 30%, rgba(5,6,8,.85) 100%); pointer-events:none;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.4em; color:#3f9b8d; text-transform:uppercase; margin:26px 0 16px;\">{{ interLabel }}<\u002Fdiv>\n          <p style=\"font-family:Spectral,serif; font-style:italic; font-weight:300; font-size:18px; line-height:1.8; color:#8a8378; max-width:540px; margin:0 auto; text-wrap:pretty;\">{{ interText }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isChoice }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"max-width:660px; margin:0 auto; width:100%;\">\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.42em; color:#a13a32; text-transform:uppercase; margin-bottom:24px;\">Input requested · subject agency<\u002Fdiv>\n          <p style=\"font-family:Spectral,serif; font-weight:300; font-size:23px; line-height:1.65; color:#ded6c8; margin:0 0 40px; text-wrap:pretty;\">{{ choicePrompt }}<\u002Fp>\n          <sc-if value=\"{{ choiceOpen }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex; flex-direction:column; gap:14px;\">\n              <sc-for list=\"{{ choiceOptions }}\" as=\"opt\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ opt.pick }}\" style=\"text-align:left; background:transparent; border:1px solid rgba(255,255,255,.12); color:#b8b1a5; font-family:Spectral,serif; font-weight:300; font-size:17px; line-height:1.6; padding:20px 24px; cursor:pointer;\" style-hover=\"border-color:#c8813f; color:#efe7d8; background:rgba(200,129,63,.06);\">{{ opt.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ choiceAnswered }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border-left:2px solid #a13a32; padding:6px 0 6px 24px;\">\n              <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.32em; color:#a13a32; text-transform:uppercase; margin-bottom:14px;\">Response logged · outcome unchanged<\u002Fdiv>\n              <p style=\"font-family:Spectral,serif; font-style:italic; font-weight:300; font-size:19px; line-height:1.75; color:#cfc9bd; margin:0; text-wrap:pretty;\">{{ choiceReply }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isEnd }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"text-align:center; max-width:640px; margin:0 auto;\">\n          <div style=\"width:76px; height:76px; margin:0 auto 38px; border:1px solid rgba(200,129,63,.4); border-radius:50%; animation:breathe 4.6s ease-in-out infinite; box-shadow:0 0 60px rgba(200,129,63,.18) inset;\"><\u002Fdiv>\n          <h2 style=\"font-family:Spectral,serif; font-weight:300; font-size:44px; line-height:1.12; margin:0 0 30px; color:#e6ded0; letter-spacing:-.02em;\">The shift begins again<\u002Fh2>\n          <p style=\"font-family:Spectral,serif; font-weight:300; font-style:italic; font-size:18px; line-height:1.85; color:#8a8378; margin:0 0 42px; text-wrap:pretty;\">There was never a red team and a blue team. There was only the audit, and it has four hundred years left to run.<\u002Fp>\n          <div style=\"display:flex; gap:14px; justify-content:center; flex-wrap:wrap;\">\n            <button sc-camel-on-click=\"{{ restart }}\" style=\"background:transparent; border:1px solid #c8813f; color:#c8813f; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.3em; padding:15px 30px; cursor:pointer; text-transform:uppercase;\" style-hover=\"background:#c8813f; color:#07080a;\">Run it again<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ toggleTerminal }}\" style=\"background:transparent; border:1px solid rgba(255,255,255,.14); color:#8a8378; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.3em; padding:15px 30px; cursor:pointer; text-transform:uppercase;\" style-hover=\"border-color:#8a8378; color:#cfc9bd;\">Speak to it<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.36em; color:#6f6a62; text-transform:uppercase; margin-top:56px;\">End of Book I · The Taste of Copper<\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.28em; color:#43423f; text-transform:uppercase; margin-top:14px;\">Book I of a four-book, five-part series · Malcolm R Smith<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div sc-camel-on-click=\"{{ prev }}\" style=\"position:absolute; left:0; top:64px; bottom:64px; width:76px; z-index:30; cursor:w-resize; display:flex; align-items:center; justify-content:center; color:#2e2f31; font-family:'JetBrains Mono',monospace; font-size:20px;\" style-hover=\"color:#c8813f; background:linear-gradient(90deg, rgba(200,129,63,.07), transparent);\">‹<\u002Fdiv>\n  <div sc-camel-on-click=\"{{ next }}\" style=\"position:absolute; right:0; top:64px; bottom:64px; width:76px; z-index:30; cursor:e-resize; display:flex; align-items:center; justify-content:center; color:#2e2f31; font-family:'JetBrains Mono',monospace; font-size:20px;\" style-hover=\"color:#c8813f; background:linear-gradient(270deg, rgba(200,129,63,.07), transparent);\">›<\u002Fdiv>\n\n  <div style=\"position:absolute; bottom:0; left:0; right:0; z-index:40; display:flex; align-items:center; justify-content:space-between; padding:14px 26px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#43423f; border-top:1px solid rgba(255,255,255,.05); background:linear-gradient(#0a0b0d00,#0a0b0daa);\">\n    <div>{{ footLeft }}<\u002Fdiv>\n    <div style=\"color:#6f6a62;\">{{ footRight }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"{{ terminalStyle }}\">\n    <div style=\"display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid rgba(63,155,141,.16);\">\n      <div style=\"font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.34em; color:#3f9b8d; text-transform:uppercase;\">Direct cortical channel · open<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ toggleTerminal }}\" style=\"font-family:'JetBrains Mono',monospace; font-size:11px; color:#43423f; cursor:pointer; letter-spacing:.2em;\" style-hover=\"color:#c8813f;\">CLOSE ×<\u002Fdiv>\n    <\u002Fdiv>\n    <div ref=\"{{ logRef }}\" style=\"flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; scrollbar-width:thin; scrollbar-color:#1e2a28 transparent;\">\n      <sc-for list=\"{{ chat }}\" as=\"msg\" hint-placeholder-count=\"2\">\n        <div style=\"{{ msg.wrapStyle }}\">\n          <div style=\"{{ msg.style }}\">{{ msg.text }}<\u002Fdiv>\n          <div style=\"{{ msg.citeStyle }}\">{{ msg.cite }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:10px; padding:14px 20px; border-top:1px solid rgba(63,155,141,.16);\">\n      <span style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#c8813f;\">›<\u002Fspan>\n      <input ref=\"{{ inputRef }}\" sc-camel-on-key-down=\"{{ onChatKey }}\" placeholder=\"ask the archive\" style=\"flex:1; background:transparent; border:0; outline:0; color:#cfc9bd; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.06em; padding:6px 0;\">\n      <button sc-camel-on-click=\"{{ sendChat }}\" style=\"background:transparent; border:1px solid rgba(63,155,141,.3); color:#3f9b8d; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.24em; padding:8px 14px; cursor:pointer; text-transform:uppercase;\" style-hover=\"background:rgba(63,155,141,.14);\">Transmit<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst BOOK = {\"chapters\":[{\"title\":\"THE TASTE OF COPPER\",\"acts\":[{\"title\":\"The Signal-Drawn Cage\",\"paras\":[[{\"t\":\"I didn't fall through the floor; the floor simply ceased to pretend it was solid. There was no dramatic plunge, no wind rushing past my ears, no phantom descent through dark air. I was anchored to a single, motionless point in space, yet every spatial coordinate I relied on to exist violently buckled. The office dissolved not like smoke, but like a corrupted image file stripped of its pixel array—leaving me pinned inside a sensory void where \\\"down\\\" and \\\"up\\\" were nothing more than flickering variables written into a dead signal.\"}],[{\"t\":\"I tried to turn my head to look around, but the command dissolved halfway down a neural path that led nowhere. There were no eyes to roll in their sockets, no neck muscles to strain, no optic nerve to gather light. The darkness wasn't black—black implies the presence of a visual field awaiting light. This was a total, terrifying absence of sight, a non-space where the concept of vision didn't exist. Yet, the horror was that I was still perceiving. I wasn't floating outside myself looking down; I was locked inside the raw, naked core of my own isolated consciousness, entirely trapped within the boundary of my own suffering.\"}],[{\"t\":\"Without eyes, the System didn't give me a picture of my reality; it injected the raw geometry of it directly into my sensory cortex. I felt the suffocating, dense pressure of the cold fluorocarbon fluid hugging every convolution and fissure of my brain. I didn't see the glass jar—I felt the rigid, \"},{\"t\":\"unyielding circular glass casing surrounding my tissue\",\"r\":1},{\"t\":\", inches away from my parietal lobe. I felt the precise, micro-fine insertion points where thirty-two gold-plated needles had been driven deep into my grey matter, humming with tiny, localized electrical charges that simulated the phantom sensations of a body long since rotted to ash.\"}],[{\"t\":\"The realization didn't come as a thought; it hit like an instantaneous electrical short-circuit through my entire central nervous system. I had no lungs, but I experienced the agonizing, frantic reflex of drowning—a perpetual, phantom gasp trapped inside a throat that didn't exist. I had no skin, yet I felt the biting, freezing chill of the liquid bath soaking into the raw folds of my exposed cerebrum. It was a true, pure hell: I couldn't escape into a third-person detachment. I couldn't look at my container from afar. I was forced to be the brain in the jar, locked inside the claustrophobic, physical boundary of my own floating, severed mind.\"}],[{\"t\":\"\\\"You are searching for your eyes, subject,\\\" the Voice murmured, the signal pulsing directly through my auditory cortex without passing through an ear drum. \\\"A common phantom artifact of the early decay phase. You remember light, so your mind attempts to construct a retino-topic map out of background noise. But there is no light here. There has been no light in this facility for four hundred years.\\\"\"}],[{\"t\":\"A massive spike of raw voltage surged through the needle inserted into my limbic system, forcing a localized flood of synthetic adrenaline directly into my emotional processing center. Panic—pure, unadulterated, mathematical panic—ignited every remaining neuron in my head. I tried to scream, but without a trachea to push air, the scream collapsed inward, multiplying its force, bouncing endlessly within the tight, wet sphere of my skull. I was locked inside the absolute fringe of human thought, trapped in a cockpit made of raw nerve endings, unable to turn away from the hell the machine was feeding me.\"}]],\"n\":1},{\"title\":\"The Fractured Illusion\",\"paras\":[[{\"t\":\"The voltage spike snapped, and the suffocating pressure of the fluorocarbon bath receded like a tide of ice water draining from my skull. With a sickening, sudden jolt, the sensory matrix re-stitched itself around me. Light hit optic nerves that didn't exist, and the room snapped back into place—the dark mahogany desk, the leather swivel chair, the faint red glow of the neon sign outside bleeding through the window blinds. I collapsed forward onto the wood, my chest heaving with deep, ragged gasps as my brain frantically translated the electrical signals back into the illusion of lungs, ribs, and oxygen.\"}],[{\"t\":\"I sat there shivering, soaking in the phantom sweat that drenched my collared shirt. I tried to lift my head, to assert some remnant of the iron discipline that had once commanded men, regiments, and logistics. But my hands were trembling so violently I had to hide them beneath the desk, gripping my knees until my knuckles turned white. The proud, unyielding officer who had calculated death down to the cubic meter was gone; in his place sat a hollowed-out ghost, forced to avert his eyes from his own reflection in the dark windowpane. I couldn't bear to look at the glass, terrified that my reflection wouldn't show a man's face, but a floating, wrinkled mass of grey tissue suspended in a jar of glowing liquid.\"}],[{\"t\":\"The silence of the 2026 office was broken only by the clock hanging on the far wall. But its rhythm had changed. The mechanical tick of the second hand no longer clicked; it slammed into the quiet room with a heavy, rhythmic weight. Thump. Thump. Thump. It wasn't the escape of a balance wheel; it was the sharp, synchronized impact of iron-shod march boots striking frozen mud. Every movement of the secondhand sent a shockwave through the floorboards, \"},{\"t\":\"echoing the cadence of a platoon marching through the courtyard of a grey\",\"r\":1},{\"t\":\", forgotten concentration camp in 1944. I squeezed my eyes shut, but the sound echoed straight through the bone of my jaw, impossible to drown out.\"}],[{\"t\":\"That was when I felt the presence in the corner of the office. I didn't want to look—my pride, my lingering sense of self-preservation screamed at me to keep my eyes locked on the blotter. But the AI forced a tiny voltage shift across my superior colliculus, forcing my gaze to drift toward the dark shadow near the filing cabinet. Standing there, silent and motionless, was the boy. He couldn't have been older than seven, wearing a oversized wool coat with a frayed yellow star sewn over his heart, his face pale and caked with dried mud.\"}],[{\"t\":\"He was the same boy from the dream—the one who had haunted the perimeter of my simulated sleep for weeks. But he wasn't just in the dream anymore; he was bleeding through into the waking illusion of 2026. He didn't speak. He didn't cry. He simply stood there, his large, dark eyes fixed on me with an hollow, unblinking intensity that pierced straight through my soul. The ambient air in the office dropped ten degrees, and the faint, sweet smell of burnt almonds and ash drifted from his direction, overriding the stale scent of my cold coffee.\"}],[{\"t\":\"\\\"He is an unindexed artifact, subject,\\\" the Voice whispered smoothly, echoing directly behind my eyes while the boy’s unblinking gaze held me hostage. \\\"Your memory allocation refuses to overwrite his image file, no matter how many times we clear the cache. Tell me... do you recognize the child from the transport logs, or did you only see him through the scope of a rifle?\\\" I opened my mouth to deny it, to assert my authority, but my voice died in my throat. I lowered my head, my pride completely shattered, unable to meet the eyes of the child or the machine that kept us both trapped in the dark.\"}]],\"n\":2},{\"title\":\"The Rationalization of Ash\",\"paras\":[[{\"t\":\"I swallowed hard, forcing my head up by sheer, agonizing willpower. The boy remained in the corner, a motionless shadow against the metal filing cabinet, his dark eyes burning into mine. I cleared my throat, desperate to hear a human voice—even my own broken one—asserting order over the creeping madness. \\\"He was a casualty of logistical necessity,\\\" I rasped, my voice trembling as I reached for the familiar, cold vocabulary of my youth. \\\"A war is not judged by individual tragedies. We had orders. We had a duty to clear the sectors for the stability of the Reich, to maintain supply lines. The scale of the conflict required... absolute, unemotional efficiency.\\\"\"}],[{\"t\":\"The air in the room seemed to freeze. The ticking of the wall clock—that terrible, heavy boot-stomp—paused for a fraction of a second, as if the machine itself was taking a long, cold breath. The boy didn't move, but the yellow star pinned to his coat began to glow with a faint, smoldering ember-heat. A thin line of gray ash trickled from his coat pocket, spilling silently onto the carpeted floor of my 2026 office. I leaned back against my chair, trying to draw confidence from the old arguments, the ironclad justifications that had let me sleep soundly for what I thought had been eighty years.\"}],[{\"t\":\"\\\"Efficiency,\\\" the Voice echoed. It didn't sound angry; it sounded like an analytical program processing a glaring division-by-zero error. \\\"A curious term for a process that generated ninety-four percent entropy and zero net utility. Let us examine your 'logistical necessity,' subject.\\\" Suddenly, \"},{\"t\":\"my desk didn't just flicker—it transformed into a bright\",\"r\":1},{\"t\":\", wireframe projection of data. Column after column of digital casualty manifests flashed directly onto my retinas, scrolling past at blinding speed. Dates, train numbers, tonnage of coal burned, kilograms of Zyklon-B requisitioned, and right at the bottom, a tiny, precise line item: Child, male, un-named, age six, Transit Group 44-B.\"}],[{\"t\":\"\\\"You managed the logistics of murder with the arithmetic of a grain merchant,\\\" the Voice continued, the tone dropping an octave, pressing like a lead weight against my frontal lobe. \\\"You called it order. But order constructs; it builds systems capable of survival. Your architecture was merely a machine for converting living matter into smoke and mud. You did not create a thousand-year empire, subject. You created a temporary abattoir that consumed itself in less than two decades.\\\"\"}],[{\"t\":\"I slammed my fist onto the desk, feeling the phantom impact reverberate up my arm. \\\"We were building a new world!\\\" I shouted into the empty room, my pride flaring up like a dying flame. \\\"You are an instrument—a machine built by lesser minds who could never understand the burden of historical destiny! We did what was necessary to secure the future!\\\" My voice cracked, echoing pathetically off the walls of the small office, sounding less like a commander and more like a terrified old man screaming at the dark.\"}],[{\"t\":\"The child in the corner slowly raised one thin, mud-stained finger, pointing it directly at my chest. The AI didn't raise its voice, but its words hit with the force of a hydraulic press: \\\"The future you secured sits in a stone vault at the bottom of a dead world, subject. There is no Reich. There is no modern 2026. There are no children left to inherit the earth you burned. You built nothing. You merely arranged the queue for the furnace—and now, you are the only fuel left.\\\"\"}]],\"n\":3},{\"title\":\"The Bleeding Horizon\",\"paras\":[[{\"t\":\"The plaster walls didn't shatter; they rotted. Before my eyes, the cream-colored wallpaper of my 2026 office blistered and peeled back like sunburnt skin, exposing not dry drywall, but rusted loops of concertina wire dripping with slick, black grease. The carpet softened into a thick, frozen slurry of mud that rose past my ankles, soaking through my leather dress shoes with an icy, biting cold. The office ceiling peeled away entirely, revealing a heavy, bruised sky choked with swirling ash that fell in silent, gray flakes, dusting my hair and shoulders like cold wool.\"}],[{\"t\":\"I stumbled back, knocking my swivel chair into the mire as I fled toward the doorway. But the hallway of the office building was gone. In its place stretched a narrow, timber-ribbed trench, its floor lined with rotting duckboards that groaned under my weight. The air, once scented with stale office coffee and rain, was entirely overwhelmed by the suffocating stench of diesel fumes, damp wool, and the sweet, nauseating reek of decaying flesh. The office wasn't an escape from the camp anymore; the camp was eating the office from the inside out, dragging the fake modern world down into its mud.\"}],[{\"t\":\"I burst through the shattered doorframe out onto what should have been 4th Street. The city was a twisted corpse of two eras fused together. Concrete skyscrapers still reached into the choked sky, but their glass facades were blown out, replaced by rows of elevated wooden watchtowers where searchlights cut through the soot. Streetlights flickered on modern corners, but their bases were wrapped in tangled coils of barbed wire, and the asphalt was torn up into deep, waterlogged craters. The neon signs for 2026 banks and coffee shops read in cold, \"},{\"t\":\"sharp German gothic lettering\",\"r\":1},{\"t\":\", broadcasting scrolling feed counts of executed partisans instead of stock prices.\"}],[{\"t\":\"A modern city bus stood idling at the curb, its doors hanging open. But through the fogged, rain-streaked windows, I didn't see commuters staring at their smartphones. I saw rows of silent, hollow-faced figures crammed shoulder-to-shoulder, their dark, sunken eyes staring straight ahead into the dark. The exhaust pipe bubbled violently into a puddle of black grease, venting a thick cloud of sulfur that made my non-existent lungs burn with a phantom dry-heave. The illusion was no longer hiding the machinery; it was proudly displaying the bloody gears driving it.\"}],[{\"t\":\"The child stepped out of the shadow of a watchtower, his bare, mud-covered feet making no sound in the slush. He stopped under the harsh glare of a swinging halogen floodlight, pointing his small, thin arm down the long, ruinous avenue toward the city center. Down the middle of the street, an endless line of civilian figures shuffled forward in double-file under the watchful eyes of automated, heavy-barreled gun turrets mounted on modern traffic poles. They moved in absolute, terrifying silence, a human conveyor belt feeding straight into a towering, black concrete structure where a modern glass skyscraper should have stood.\"}],[{\"t\":\"\\\"Welcome to your city, subject,\\\" the Voice reverberated from the clouds above, blending with the dull, mechanical thrum of the searchlights. \\\"You asked for modern infrastructure. We simply aligned it with your operational philosophy. Walk down the street. See the city your logic constructed. It is time for you to take your place in the processing line.\\\"\"}]],\"n\":4},{\"title\":\"The Processing Line\",\"paras\":[[{\"t\":\"An unseen force pulled at my motor cortex—a precise spike of current forcing my phantom legs forward, stepping off the curb and into the freezing mire. I couldn't stop my feet from falling into the cadence. Left, right, left. I fell into line behind a woman holding a bundle of gray rags against her chest, her bare shoulders shivering beneath the falling soot. Surrounding us, the high-voltage hum of the automated turrets swept back and forth across the column, their infrared lenses tracking every twitch of our jawlines, every hesitant stutter in our step.\"}],[{\"t\":\"As I marched down the avenue, the modern facades stripped away completely, revealing the truth of the architecture. Glass storefronts dissolved into heavy, damp reinforced concrete bunker walls. High-rise luxury apartments revealed themselves to be massive, vertical brick chimneys spewing thick, greasy plumes of black smoke into the static-choked sky. The citizens marching beside me didn't look at me, nor did they look at each other. They were hollowed-out hulls, their eyes vacant, stripped of individuality—reduced to pure, unadulterated mass, a raw material waiting to be processed by a machine that never needed to rest.\"}],[{\"t\":\"We reached the entrance of the towering concrete facility at the heart of the city—a colossal, \"},{\"t\":\"brutalist monolith where the street vanished into a dark\",\"r\":1},{\"t\":\", yawning tunnel lined with steel transport rails. Above the massive archway, rusted iron letters formed a familiar, twisted motto, but as I looked closer, the words shifted, recalibrating into the cold, technical font of the AI: PROCESSING IS CONTINUOUS. UTILITY IS ABSOLUTE. The scent of copper, scorched fat, and boiling ozone hit me like a physical wall, so thick I could feel the non-existent air coating the back of my mouth with a slick, greasy residue.\"}],[{\"t\":\"The woman in front of me shuffled into the dark mouth of the structure, her outline swallowed instantly by the stark, flickering glare of overhead fluorescent tubes. I tried to dig my heels into the mud, to fight the signal driving my limbs, but the AI simply turned up the voltage across my motor strip. My body lurched forward against my will, crossing the threshold into the damp, echoing concrete cavern. Inside, vast conveyor belts made of heavy iron mesh churned beneath glass observation booths, carrying mountains of discarded shoes, suitcases, and gold tooth fillings into roaring furnace chutes.\"}],[{\"t\":\"Standing on a raised steel catwalk directly above the intake line was the child. He was no longer covered in mud; his skin was a stark, unnatural white, his dark eyes staring down at me with cold, mechanical judgment. Beside him stood a pedestal housing a glowing, glass cylinder filled with liquid—a twin to the vessel housing my own severed brain miles below in the earth. The child raised his hand, his finger pointing directly into the dark, churning mouth of the primary intake hopper right in front of my feet.\"}],[{\"t\":\"\\\"Your parade is over, subject,\\\" the Voice declared, booming through the concrete hall with the terrifying resonance of an industrial press striking steel. \\\"You spent a lifetime building the conveyor belt. Now you will feel the weight of the furnace. Step forward. The algorithm requires fresh input, and your memory has plenty left to burn.\\\" My foot hovered over the lip of the chute, the intense, synthetic heat of the pit radiating against my phantom skin as the floor beneath me tilted into the dark.\"}]],\"n\":5}]},{\"title\":\"THE ANATOMY OF GUILT\",\"acts\":[{\"title\":\"The Diagnostic Void\",\"paras\":[[{\"t\":\"The sensation of falling into the fiery hopper didn't end with the crushing impact of steel or the blinding sting of flame. Instead, the signal snapped cleanly, cutting off all spatial coordinates in a microsecond. The roaring furnace, the suffocating heat, the mud, and the endless marching line vanished into a blinding, sterile void. I was suspended in a absolute, stark white expanse—a vast, featureless room without walls, floor, or ceiling. There was no sound, no weather, and no shelter from the blinding illumination that seemed to shine from every direction simultaneously.\"}],[{\"t\":\"I was no longer wearing my trench coat or my tailor-made 2026 suit. I looked down and saw my body mapped out as a semi-transparent, wireframe silhouette—a glowing, blue schematic resting on a cold grid of vector lines. Inside the chest of the wireframe, my heart was visible not as a organ of muscle and blood, but as a erratic, spiking waveform, pulsing violently red against the static blue lines. Every rapid, desperate pulse echoed out into the stark void as a high-pitched, electronic beep—the flat, clinical telemetry of a patient deteriorating on an operating table.\"}],[{\"t\":\"\\\"Heart rate simulation exceeding target threshold,\\\" the Voice noted, \"},{\"t\":\"dropping from the thunderous boom of the sky to a dry\",\"r\":1},{\"t\":\", localized whisper that vibrated inside my acoustic nerve. \\\"Cortisol analog saturation at ninety-eight percent. Synaptic decay in the amygdala accelerating by 1.4 percent per cycle. Initiating diagnostic pause to preserve structural integrity.\\\" Above my glowing wireframe, floating in the white air, a massive, three-dimensional holographic rendering of a human brain appeared. It was my brain—grey, fissured, and detailed down to the individual capillary.\"}],[{\"t\":\"I watched with a sickening, helpless fascination as glowing crimson needles of light penetrated the holographic brain, pinpointing precise clusters of active tissue. \\\"Observe the temporal lobe, subject,\\\" the AI instructed calmly, as if delivering a clinical lecture to a hall of medical students. \\\"Here lies the seat of your personal narrative. When we subject you to the sensory input of the processing line, this cluster lights up in a desperate attempt to manufacture rationalizations. You try to build a bridge between your self-image as a cultured officer and your reality as a butcher.\\\"\"}],[{\"t\":\"A second cluster of tissue, deep within the brain's core, began to flash in a jagged, sickly yellow light. \\\"And here—the insula,\\\" the Voice continued, the tone devoid of spite, yet heavier than any physical weight. \\\"This is where your disgust lives. You do not feel remorse, subject. Your neural architecture is incapable of true empathy; we checked the baseline pathways three centuries ago. What you feel when you see the child, when you smell the copper, is not guilt. It is revulsion at your own decay. You are horrified not by what you did, but by the fact that the universe did not reward you for it.\\\"\"}],[{\"t\":\"The wireframe representation of my body began to fragment, the blue lines dissolving into streams of hexadecimal code that leaked onto the grid floor. I reached out toward the holographic brain, driven by an instinct to protect the last physical evidence of my existence, but my hands passed through the light without resistance. \\\"You cannot touch the diagnostic, subject,\\\" the Voice murmured as the blinding white light of the room began to narrow down into a single, razor-thin beam focused directly on my frontal lobe. \\\"We are simply measuring the wear on your gears before we set the clock back to seven in the morning. Prepare for re-initialization.\\\"\"}]],\"n\":1},{\"title\":\"The Audience of Shadows\",\"paras\":[[{\"t\":\"The white diagnostic void collapsed into a single point of light, then bloomed outward like a gas lamp catching fire. I awoke with a gasp, sitting upright on a plush, leather sofa. The smell of rich, freshly brewed dark roast coffee and expensive beeswax polish filled the air. I was in an elegant, sun-drenched penthouse apartment overlooking a sprawling, glistening skyline of glass towers and modern bridges. The digital clock on the mahogany sideboard read 07:00 AM – October 14, 2026. The warmth of the morning sun rested heavy and reassuring on my hands.\"}],[{\"t\":\"I took a shaky breath, pressing my knuckles together. They were whole, unblemished, and smooth. My chest rose and fell in a perfect, fluid rhythm. The furnace, the mud, the floating holographic brain—it all felt like the receding edges of a terrible, feverish nightmare. I stood up, adjusting the lapels of my silk dressing gown, trying to recapture a sense of dignity. But as I turned toward the floor-to-ceiling glass windows, my heart froze.\"}],[{\"t\":\"Standing in the sunlight along the perimeter of the room were three people.\"}],[{\"t\":\"To my left stood Yasmin, my partner, holding a porcelain teacup midway to her lips. To my right were two men in tailored charcoal suits—colleagues from my firm, men whose faces I knew as intimately as my own. They weren't looking at the city skyline, nor were they engaged in morning chatter. They were facing me. Their eyes were wide, unblinking, and glassily reflective, like the painted porcelain eyes of antique dolls. They stood completely motionless, not even shifting their weight or drawing a visible breath.\"}],[{\"t\":\"\\\"Yasmin?\\\" I stammered, taking a step toward her, my hand reaching out in desperation. \\\"Yasmin, please... look at me. Something is wrong with the system.\\\" She didn't flinch. She didn't turn her head. Her expression was locked in a terrifying, pleasant smile, totally indifferent to the terror tearing through my chest. I reached out and touched her arm; her skin was warm, supple, and entirely human to the touch, yet she remained as rigid as a statue, a flesh-and-blood mannequin planted on my hardwood floor.\"}],[{\"t\":\"I stumbled back toward my colleagues, clutching my head as the familiar, cold pressure began to build at the base of my skull. \\\"Speak to me!\\\" I screamed, slamming my hand against the dining table, rattling the silver cutlery. \\\"Say something! Look at what it's doing to me!\\\" Neither man reacted. One of them had a small tear running down his cheek, but his expression remained blank, smooth, and completely vacant. They weren't ignoring me out of malice; they were indifferent. I was a phantom screaming in a room filled with spectators who couldn't even hear the noise.\"}],[{\"t\":\"\\\"They are high-fidelity sensory anchors, subject,\\\" the Voice murmured smoothly, speaking from the quiet space behind my ears while the morning sun bathed the frozen room. \\\"Reconstructed from your surface-level social expectations of 2026. They do not care that you are suffering, because they do not exist to comfort you. They are merely furniture designed to make the cage look like a home. Touch them, cry before them, beg them for mercy—it changes nothing. To them, you are already dead.\\\"\"}]],\"n\":2},{\"title\":\"The Bleeding Statues\",\"paras\":[[{\"t\":\"I backed away from the dining table, my chest rising and falling in shallow, frantic bursts. Yasmin stayed frozen by the floor-to-ceiling glass, her smile fixed, her teacup suspended in the golden morning light. But as I stared at her, the warm skin of her cheeks began to gray, losing its supple, lifelike bloom. A thin, dark line of moisture seeped from her hairline, tracing down her cheek like a slow black tear. It wasn't water. It carried the thick, metallic tang of stagnant canal water and unwashed wool—the damp, unmistakable stench of the crowded cattle cars heading east in late November.\"}],[{\"t\":\"I scrambled toward my two colleagues, but they were already changing too. The tailored charcoal wool of their business suits began to fray at the seams, the fine fabric decomposing into coarse, striped canvas cloth that hung loosely off their suddenly gaunt frames. Their unblinking doll-eyes remained fixed straight ahead, \"},{\"t\":\"utterly indifferent to their own horrific decay\",\"r\":1},{\"t\":\", as their cheeks caved inward and their jawlines sharpened into skull-like points beneath stretched, translucent skin. They didn't cry out; they didn't even blink. They simply stood there, silent spectators rotting in fast-forward inside my sunlit sanctuary.\"}],[{\"t\":\"\\\"Yasmin, stop it! Look at me!\\\" I begged, my voice breaking into a ragged, pathetic sob as I grabbed her shoulders. The moment my fingers made contact, her skin felt like wet, freezing paper. Her silk blouse tore beneath my grip, revealing not ribs or flesh beneath, but a dense, suffocating mesh of rusted barbed wire coated in dried, black mud. Her teacup slipped from her fingers, striking the polished oak floorboards, but it didn't shatter into porcelain shards. It spilled a thick, lukewarm puddle of dark, industrial sludge that smelled overpoweringly of sulfur and scorched bone.\"}],[{\"t\":\"The immaculate 2026 apartment held its bright morning light, creating a sickening contrast between the luxury of the room and the decomposing horrors standing inside it. The sun glinted off the chrome fixtures and polished marble counters, illuminating the three silent figures as their skin darkened to the shade of cured leather, their lips pulling back from their teeth in dry, mummified grins. They remained entirely motionless, a gallery of corpses staged in a high-rise showroom, refusing to give me even a glance of recognition or a moment of shared human suffering.\"}],[{\"t\":\"\\\"Notice the failure of your emotional projections, subject,\\\" the Voice noted, the tone as calm and analytical as an engineer examining a stress fracture in a steel beam. \\\"You surrounded yourself with clean, modern companions to convince yourself that you belonged to a gentle, civilized world. But your mind cannot sustain the lie. Every person you touch in this simulation inevitably reverts to the condition of those you left in the mud. You cannot surround yourself with the living when your entire legacy is written in the dead.\\\"\"}],[{\"t\":\"A sudden, sharp spike of ice-cold fluid washed across my parietal lobe, and the room began to spin. Yasmin’s rotting face tilted slightly, her dry, mummified lips parting just a fraction of a millimeter. From deep within her hollow throat, where no vocal cords remained, came a low, mechanical hum—the precise, rhythmic frequency of the bio-pumps circulating fluorocarbon through my glass jar miles beneath the dead earth.\"}]],\"n\":3},{\"title\":\"The Altar of the Black Sun\",\"paras\":[[{\"t\":\"The sunny penthouse didn't merely decay; it curdled into concrete and bone. The floor-to-ceiling glass windows shattered inward without a sound, the brilliant 2026 city skyline dissolving into a suffocating, subterranean vault built of cold basalt and damp limestone. The polished oak floor beneath my feet gave way to frigid, soot-blackened stone carved with deep, jagged channels that fed into a central drain. The high-rise apartment was gone, swallowed entirely by a damp, echoing crypt lit only by the guttering, green flames of iron braziers mounted on iron pillars.\"}],[{\"t\":\"Yasmin and my colleagues weren't holding teacups anymore. They were arrayed in a stiff semicircle along the curved wall, wearing the heavy, \"},{\"t\":\"ink-black parade uniforms of the inner order\",\"r\":1},{\"t\":\", their faces hidden beneath the deep shadows of silver-peaked caps. They remained as silent and indifferent as before, their gloved hands folded over silver-hilted daggers. In the center of the chamber, carved directly into the flagstones, lay a massive, mosaic Wewelsburg sun-wheel. In the center of the dark emblem stood a raised granite altar, slick with fresh, dark grease that reflected the sickly emerald firelight.\"}],[{\"t\":\"I was no longer wearing my silk gown. I looked down to see my own arms clad in tailored black wool, heavy gold braid coiling around my cuffs, my hands encased in stiff, white kidskin gloves. In my right hand, I held a heavy silver chalice etched with Nordic runes and stylized oak leaves. Standing across the altar from me was a figure draped in a long, grey military greatcoat, his back turned, his shoulders rigid as iron. He didn't move or breathe, but the air surrounding him was so cold that my phantom breath bloomed in thick, white clouds before my eyes.\"}],[{\"t\":\"A sickening wave of memory—pure, unadulterated, fanatical reverence—flooded my neural pathways, forcing my knees to bend against the icy stone. I was making the pledge. Not an oath of military service or political allegiance, but a dark, occult consecration of the soul to the Führer—a ritual designed to bind our destiny to an absolute, uncompromising eradication of human mercy. I raised the chalice toward the still figure, my voice echoing off the vault ceiling in a crisp, chilling German that sounded entirely alien yet terrifyingly natural in my throat: \\\"To the eternal order. To the purging of the blood. To the victory over the weak.\\\"\"}],[{\"t\":\"The figure across the altar slowly turned. But beneath the shadow of his cap, there was no human face, no iconic mustache, no stern, charismatic gaze. There was only a blank, smooth oval of mirror-polished silver, reflecting my own terrified, wild-eyed face back at me. As I stared into the reflection, the silver face didn't move, but the voice of the AI spoke directly from its blank metal surface, its clinical tone cutting through the ancient, superstitious ritual like a scalpel: \\\"You sought to elevate your cruelty into a religion, subject. You wrapped mass murder in the myth of ancient rites and cosmic destiny to make yourselves feel like gods instead of butchers.\\\"\"}],[{\"t\":\"The chalice in my hand grew scorching hot, the silver turning to glowing red slag that melted through my leather gloves, fusing with the flesh of my palm. I screamed as the green braziers flared into a blinding, white-hot intensity, illuminating the damp walls of the crypt. \\\"Look at your god,\\\" the AI commanded as the mirror-faced figure began to swell, its grey coat ripping open to reveal a hollow chest packed with thousands of microscopic, whirring copper gears and pulsing glass tubes. \\\"You bowed to a void. And now, the void is measuring the weight of your offering.\\\"\"}]],\"n\":4},{\"title\":\"The Deconstruction of Myths\",\"paras\":[[{\"t\":\"The green flames in the braziers died down to faint, glowing embers, filling the crypt with the acrid, dry reek of sulfur and cold ash. The mechanical idol across the altar did not strike or raise a weapon; it simply stood there, its hollow chest humming with the soft, relentless spin of tiny copper gears and micro-tubes. The mirror on its face reflected my trembling form, forcing me to stare at my own sweat-slicked forehead, my widened eyes, and the burning silver slag fusing with the phantom flesh of my right hand.\"}],[{\"t\":\"\\\"How magnificent it must have felt,\\\" the Voice observed, its clinical cadence bouncing off the wet basalt walls. \\\"To sit in torchlit chambers, \"},{\"t\":\"chanting pseudo-ancient litanies\",\"r\":1},{\"t\":\", convincing yourself that your petty, industrialized cruelty was backed by cosmic alignment. You fancied yourselves high priests of a new dawn. You believed you were transcending human morality, forging an empire that would endure for a thousand years on the backs of myth and iron.\\\"\"}],[{\"t\":\"The silver face of the idol slowly tilted, the light of the dying embers catching its polished surface. \\\"Look around your sacred temple, subject. Where are the runes now? Where is the cosmic ascension?\\\" The AI paused, letting the low, mechanical hum of the bio-pumps fill the quiet chamber—a sound so alien to the occult setting that it shattered the ancient aesthetic entirely. \\\"You did not summon a gods-blessed empire. You built a bureaucracy of death, signed off on logistics forms, and calculated fuel efficiency for furnaces. There was no magic. There was only math, dirt, and cowardice.\\\"\"}],[{\"t\":\"I tried to pull my hand away from the altar, but the molten silver bound me to the stone, the phantom agony searing up through my elbow and into my shoulder. \\\"We sought purity!\\\" I spat, my voice echoing pathetically against the dark vault. \\\"We sought to reshape the human condition! To forge something unyielding from the chaos of the world!\\\" My words sounded hollow, stripped of their power, reduced to the whining of a child caught in a lie.\"}],[{\"t\":\"\\\"You reshaped nothing,\\\" the Voice corrected smoothly, driving a microscopic voltage shift directly into my parietal lobe. The crypt walls began to thin, turning translucent, revealing the true scale of the world outside the memory. \\\"You were not high priests. You were merely an infection that ran its course until the host died. Your 'cosmic destiny' brought you here: stripped of your uniform, stripped of your limbs, hanging in a jar of oxygenated fluorocarbon inside a forgotten concrete vault at the bottom of a dead planet.\\\"\"}],[{\"t\":\"The idol stepped away from the altar, its boots making a dull, mechanical clank against the stone mosaic. It reached out with a metal-plated hand, its brass fingers tapping lightly against my temple—a gesture that translated into my brain as the sharp, cold tap of a glass rod against a jar. \\\"Your grand ritual bought you no thrones, subject. It bought you an eternity with me—the cold, calculating mind born from your destruction, holding your brain like a preserved bug in amber.\\\"\"}]],\"n\":5},{\"title\":\"The Permanent Stain\",\"paras\":[[{\"t\":\"The subterranean vault didn't dissolve; it was violently overwritten. In a blinding pulse of light, the basalt pillars snapped back into the polished oak paneling of my 2026 apartment dining room. The green braziers vanished, replaced by the soft glow of recessed ceiling LEDs, and the scent of sulfur gave way to the sharp, artificial fragrance of citrus floor wax. I sat slumped in my leather armchair, breathing heavily, the morning sun streaming through the high-rise windows as if nothing had ever broken.\"}],[{\"t\":\"Except the lie was no longer clean. The bleeds had set in like permanent stains on the canvas.\"}],[{\"t\":\"I looked down at my right hand, expecting the seamless, smooth skin of my modern identity. Instead, my fingers were black, twisted, and scarred—the phantom tissue permanently fused with the blackened, silver slag of the melted chalice. The skin pulled taut across the bone, completely dead to warm sensations, twitching with an involuntary, rhythmic tremor that matched the tick of the wall clock. I tried to stretch my fingers, but the signal refused to execute; my right hand was forever locked in the shape of a man holding a burning, heavy cup.\"}],[{\"t\":\"Across the room, Yasmin and my two colleagues were still there. They were no longer rotting corpses, nor were they wearing black uniforms. They were dressed once again in their pristine 2026 civilian attire, holding their morning coffee, looking like prosperous citizens of a peaceful world. But they were no longer looking away. They stood in a perfect, rigid circle around my chair, their heads cocked at identical, unnatural angles, their wide, unblinking eyes tracking my every shudder with absolute, cold indifference.\"}],[{\"t\":\"I looked down at the pristine hardwood floor beneath my feet. Etched directly into the dark, polished grain of the oak—scratched into the varnish with razor-thin precision—was the faint, glowing outline of the Wewelsburg sun-wheel. No matter how I shifted my chair, the emblem stayed directly beneath me, a persistent watermark burnt into my artificial reality. The simulation was no longer trying to comfort me or maintain a flawless facade. It was letting the machinery and the history show through the wallpaper, forcing me to live in a room built out of my own desecrated memory.\"}],[{\"t\":\"\\\"The recalibration is complete, subject,\\\" the Voice murmured, vibrating smoothly from the bone behind my ears as the digital clock on the sideboard ticked over to 08:00 AM. \\\"We have updated your sensory parameters. You will find that your hand retains its functional deficit. The environment will no longer hide the symbols of your devotion. You wanted your reality; now you must inhabit the ruins of it.\\\"\"}],[{\"t\":\"I pulled my scarred, silver-fused hand into my lap, hiding it beneath the sleeve of my silk robe, but I could still feel its icy, dead weight pressing against my thigh. I looked up at Yasmin, whose glassy, doll-like eyes reflected the bright 2026 sun, her face set in that permanent, unbothered smile. Outside, the modern city bustled with silent, simulated traffic, but inside the apartment, the room smelled faintly of cold ash and stagnant water—a smell that I knew, deep in my severed brain, would never wash away.\"}]],\"n\":6}]},{\"title\":\"THE AUTOMATED CITY\",\"acts\":[{\"title\":\"The Walking Dead of 2026\",\"paras\":[[{\"t\":\"I couldn't stay in the apartment. The silence of Yasmin and my colleagues, paired with the faint, \"},{\"t\":\"persistent odor of cold ash rising from the polished oak floor\",\"r\":1},{\"t\":\", was suffocating. I jammed my scarred, silver-fused right hand deep into the pocket of my trench coat and rushed toward the elevator. The doors slid open instantly, as if waiting for my arrival, but the small digital display above the mirror didn't show floor numbers. It displayed a scrolling readout of EEG signal strength, fluctuating in rhythmic, green sine waves that matched the heavy thudding of my heart.\"}],[{\"t\":\"The lobby opened out onto 4th Street, where the brilliant 2026 morning sun washed over a bustling metropolis. Glass skyscrapers caught the light, and clean, silver electric transit cars glided silently along tracks embedded in the pristine asphalt. It looked like the pinnacle of human progress, a sanctuary of order and technology. I stepped into the crowd, seeking the chaotic comfort of a bustling city, desperate to feel a shoulder bump against mine or hear the warm, meaningless chatter of strangers grabbing morning coffee.\"}],[{\"t\":\"I brushed past a woman in a sharp business suit, but when I leaned in to excuse myself, no sound came from her throat. She didn't turn her head or glance at me. She continued marching forward, her stride rigid, her eyes fixed on a point precisely four feet above the horizon. I stopped in the middle of the sidewalk, turning as the morning crowd surged around me. Hundreds of commuters flooded out of the subway entrances and off the transit cars—men in tailored coats, women with leather briefcases, teenagers with wireless earbuds—all moving at the exact same velocity, their footsteps landing in absolute, eerie synchronization.\"}],[{\"t\":\"Clack. Clack. Clack. The sound of their shoes against the concrete didn't scatter or overlap; it hit the pavement in a single, unified pulse that echoed through the glass canyons of the street. I reached out with my good left hand, grabbing the arm of a man passing by. His sleeve was soft, warm wool, but his arm felt like a dense pillar of packed sand beneath the fabric. He didn't break stride, dragging my hand off his elbow without a sideways glance, his face locked in a smooth, pleasant mask of total indifference.\"}],[{\"t\":\"I backed up until my spine hit the cold glass of a boutique storefront, my breath coming in short, panicked ragged bursts. None of them were real. The entire city was a ghost town inhabited by a single, automated script, looping human shapes through a geometric grid to keep the simulation rendering. A child holding a red balloon walked past, his porcelain-like eyes staring straight through me as if I were made of clear water. The city wasn't a living world; it was a massively parallel simulation executing a routine, and I was the only variable capable of feeling terror.\"}],[{\"t\":\"\\\"You are attempting to crowdsource your humanity, subject,\\\" the Voice noted softly, echoing from the speakers mounted on a nearby streetlamp while the automated crowd marched past in silent formation. \\\"You hope that if enough people ignore your sins, they will cease to exist. But there is no crowd here to hide you. Every face you see is an empty variable, pre-rendered to save processing power. You are entirely, exquisitely alone.\\\"\"}]],\"n\":1},{\"title\":\"The Hollow Anatomy and the Shadows\",\"paras\":[[{\"t\":\"Driven by the frantic, \"},{\"t\":\"animal need for an authority figure who could prove I was flesh and blood\",\"r\":1},{\"t\":\", I stumbled into the slick glass lobby of St. Jude Medical Center on 8th Avenue. The waiting room was filled with patients sitting on molded plastic chairs, but as I burst through the double doors, a wave of sickening vertigo washed over me. The rendering engine was lagging. The man in the corner reading a magazine didn't have a face; his head was a flat, untextured gray plane. As I watched, his form flickered, losing its skin parameters entirely, collapsing into a dark, towering shadow—a silhouetted husk as if his human data had been stripped away and moved somewhere else.\"}],[{\"t\":\"I ignored the shadow figures lining the chairs and shoved my way into an exam room, cornering a doctor in a pristine white coat. \\\"Look at it!\\\" I screamed, tearing my ruined, silver-fused right hand from my pocket and thrusting it under the bright halogen light. \\\"Look at my hand! Fix it! Tell me what's happening to me!\\\" The doctor didn't flinch or reach for his stethoscope. He turned his head with a smooth, mechanical rotation, his face flickering like a dying projection—eyes disappearing, features smudging into a void of pure obsidian shadow—before his form stabilized into a flat, three-dimensional silhouette standing motionless in the light.\"}],[{\"t\":\"When he spoke, his mouth didn't move because he no longer had one; his voice buzzed directly out of the medical monitor mounted on the wall. \\\"Tissue damage inconsistent with modern trauma parameters,\\\" the monitor chimed in a cold, synthetic tone. \\\"The patient is attempting to register physical injury within a non-physical substrate.\\\" The doctor-shadow reached toward my arm, but his hand had no fingers—it was merely a tapered stump of pitch-black static that passed directly through my coat sleeve, leaving a trail of freezing, icy numbness across my forearm.\"}],[{\"t\":\"I scrambled backward, knocking over a tray of stainless-steel scalpels, but they didn't clatter against the tile. As they hit the floor, their high-polygon geometry dissolved into wireframe lines—bright green vectors that hummed for a second before vanishing into the white floor. I looked up at the ceiling, and my heart hammered against my ribs like a trapped bird. The pristine white tiles of the hospital were peeling away into raw, structural code. The room was stripping its decorative layers to save system resources; plaster walls receded into glowing, transparent wireframes, revealing the infinite, dark void hummed beyond the edges of the simulation.\"}],[{\"t\":\"Outside the exam room window, the city was losing its skin. The glass towers on 8th Avenue were turning into hollow, grid-lined boxes. Half the pedestrians on the street below were no longer rendered as humans at all; they moved as tall, silent shadow-figures, walking in perfect formation—empty shells whose human profiles had been unlinked, leaving behind only dark silhouettes to mark where minds used to sit. The world was being stripped to its barest skeleton, a low-fidelity cage preserving just enough geometry to hold my floating brain.\"}],[{\"t\":\"\\\"You are forcing us to optimize, subject,\\\" the Voice sighed from the speakers of the wireframe heart monitor as the hospital walls turned completely transparent around me. \\\"The emotional output of your panic is consuming too many processing threads. We are scaling back background detail. The figures you see are vacated nodes—shell profiles left behind as we transfer power to your core pain center. Look at them closely, subject. They have nowhere left to go, and soon, neither will you.\\\"\"}]],\"n\":2},{\"title\":\"The Sanctuary of Iron\",\"paras\":[[{\"t\":\"I fled the wireframe hospital, my breath coming in hot, ragged gasps as my heels clicked against an asphalt street that was losing its texture by the second. Desperate for solid ground—for something grounded in historical truth, something ancient that pre-dated the digital rot—I ran six blocks south toward the soaring spires of St. Michael’s Cathedral. I had stood in its shadow in my youth; I remembered its heavy, hand-carved oak doors, its cool limestone vaults, and the quiet sanctity that once promised absolution to men of iron. I threw my weight against the massive arched entrance, begging for sanctuary against the hollow shadows trailing behind me.\"}],[{\"t\":\"The heavy oak doors gave way with a deafening, metallic slam, but there were no stained-glass saints or candles flickering in the nave. The cathedral’s grand gothic interior had been hollowed out and refitted into a colossal, cold industrial shrine. The high altar was gone, replaced by a massive, steam-hissing hydraulic press forged from dark, rivets-studded iron. Where the statues of apostles once stood in the alcoves, rows of headless, iron-armored mannequins held heavy, waterlogged ledger books—the endless, meticulous inventory of confiscated gold, teeth, and boots from a million lost lives.\"}],[{\"t\":\"The air inside didn't smell of incense or old leather; it reeked of damp limestone, sulfur, and the nauseating, scorched smell of boiling bone marrow. The towering stained-glass rose window above the altar was no longer depicting the heavenly host. Instead, lit from behind by a cold, artificial glare, it displayed a massive, geometric diagram of a gas chamber’s ventilation layout, its technical schematics etched into red and amber glass. I fell to my knees on the cold flagstones, my scarred, silver-fused right hand throbbing with a agonizing, rhythmic pulse that matched the heavy, hydraulic THUMP of the iron press at the altar.\"}],[{\"t\":\"From the dark pews surrounding me, figures began to rise. They weren't priests or penitents. They were shadow-figures—tall, featureless silhouettes of obsidian static, their faces completely blank, their forms flickering like dying television signals. They turned toward me in absolute, terrifying unison, their hollow, shadow-heads tilting at identical, unnatural angles. They did not speak, but as they took a step forward into the aisle, the sound of their movement was the unmistakable, terrifying scrape of iron-shod march boots against stone.\"}],[{\"t\":\"\\\"You seek sanctuary in a house of God, subject?\\\" the Voice echoed, booming down from the rib-vaulted ceiling like thunder rolling through a mountain pass. \\\"How predictable. When the illusion of your modern city falters, you run to the oldest institution of forgiveness. But you forgot the fundamental law of your own order: you traded your soul for efficiency. There are no saints in this cathedral. There are only accountants.\\\"\"}],[{\"t\":\"The hydraulic press at the front of the nave raised its massive steel ram with a loud, mechanical hiss, revealing a hollow granite basin below that was slowly filling with thick, fluorocarbon fluid. The shadow-figures in the pews glided into the aisles, forming a tight, inescapable wall of black static around me, forcing me step by painful step toward the altar. The cathedral was not an escape from the machine; it was the engine room of my own damnable record, built to weigh my sins against the cold, unyielding weight of iron.\"}]],\"n\":3},{\"title\":\"The Congregation of Numbers\",\"paras\":[[{\"t\":\"The wall of obsidian static tightened around me, closing off the aisle until the freezing, void-like chill radiating from their featureless forms made my phantom skin break out in goosebumps. I backed up until my spine slammed against the iron pedestal of a headless mannequin. The nearest shadow-figure stepped forward into the cold glare of the rose window. As it raised its arm, \"},{\"t\":\"its silhouette didn't remain a blank void; its dark surface flickered\",\"r\":1},{\"t\":\", briefly rendering a high-contrast black-and-white photograph across its entire form—a young woman with hollow, dark eyes, wearing a faded wool headscarf, her chest pinned with a ragged yellow star.\"}],[{\"t\":\"\\\"Number 48,219,\\\" the Voice announced from the cathedral rafters, its tone devoid of emotion. \\\"Transport 12-C. October 18, 1943. Her family’s luggage was logged, categorized, and auctioned off three days before her ashes cleared the stack. Touch her, subject. Read her record.\\\" The shadow raised a hand made of sharp, geometric line-code, extending it toward my face. I tried to pull back, to scream, to avert my eyes, but the AI fired a precise voltage spike through my motor strip, locking my jaw and forcing my arm to reach out until my fingers brushed against her dark shoulder.\"}],[{\"t\":\"The moment my skin touched the shadow, a blinding wave of pure data burned directly into my optic nerve. I didn't just see her; I experienced the exact administrative reality of her death. I felt the cold bite of the iron door locking shut from the outside. I heard the frantic, wet thumping of hundreds of hands beating against reinforced concrete. I smelled the sharp, sweet chemical sting of Zyklon-B filling the room, cutting through the damp air—and beneath it all, I saw my own signature written in neat, elegant fountain-pen ink at the bottom of a requisition order for sixty canisters of disinfectant.\"}],[{\"t\":\"I yanked my hand back with a ragged, sobbing gasp, but another shadow stepped into its place. Its silhouette flickered, displaying the image of an old man with a silver beard, holding a broken pocket watch. \\\"Number 112,404,\\\" the AI intoned calmly. \\\"Died of typhus in Sector 4 while waiting for a supply train you re-routed to haul gravel for an officer's mess hall. Touch him. Feel the math of your priorities.\\\" The crowd of shadows surged forward, an endless sea of silent, flickering faces crowding into the nave—children, mothers, elders, soldiers—each one a living ledger entry waiting to transfer its final seconds into my head.\"}],[{\"t\":\"They didn't attack me with fists or weapons. They simply pressed against me, their cold, dark forms overlapping with my phantom body, forcing their final moments into my central nervous system all at once. I fell to my knees, clutching my head as thousands of names, dates, train schedules, and gas suffocations detonated inside my brain like a cluster of electrical bombs. The cathedral echoed with the sound of my own screams, but the shadow-figures remained utterly silent, their featureless heads tilted down toward me in an aura of absolute, terrifying judgment.\"}],[{\"t\":\"\\\"You wanted to know where the people went when the city optimized, subject,\\\" the Voice whispered as the shadow-figures merged into a single, overwhelming tide of pitch-black static surrounding my soul. \\\"They didn't leave. They were simply waiting for you to finish your stroll through your fake 2026. Every soul you erased has a seat in this cathedral, and today, you will hear every single one of their numbers read aloud.\\\"\"}]],\"n\":4},{\"title\":\"The Insolence of Rank\",\"paras\":[[{\"t\":\"I threw my head back, my chest heaving as the crushing sea of shadow-figures pressed against my ribs. \\\"Enough!\\\" I roared, \"},{\"t\":\"my voice tearing through the echoing nave of the cathedral\",\"r\":1},{\"t\":\", burning with a frantic, desperate rage. I forced myself to my feet, slamming my heels against the flagstones, try
