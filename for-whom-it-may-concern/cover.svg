<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0b1230"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#e2e8f0">
    <circle cx="120" cy="80" r="1.6" opacity="0.8"/>
    <circle cx="200" cy="150" r="1" opacity="0.5"/>
    <circle cx="340" cy="60" r="1.3" opacity="0.7"/>
    <circle cx="980" cy="90" r="1.4" opacity="0.6"/>
    <circle cx="1080" cy="200" r="1" opacity="0.5"/>
    <circle cx="900" cy="480" r="1.3" opacity="0.6"/>
    <circle cx="1120" cy="520" r="1.6" opacity="0.8"/>
    <circle cx="60" cy="420" r="1.2" opacity="0.6"/>
    <circle cx="150" cy="500" r="1" opacity="0.5"/>
    <circle cx="500" cy="40" r="1" opacity="0.4"/>
  </g>

  <!-- wormhole / portal -->
  <circle cx="960" cy="330" r="230" fill="url(#glow)"/>
  <g stroke="#a5b4fc" fill="none" opacity="0.55">
    <ellipse cx="960" cy="330" rx="150" ry="150"/>
    <ellipse cx="960" cy="330" rx="110" ry="110"/>
    <ellipse cx="960" cy="330" rx="70" ry="70"/>
  </g>

  <text x="80" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#818cf8" letter-spacing="3" font-weight="600">A SAVVY SECURITY NOVEL</text>
  <text x="78" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#f8fafc" font-weight="700">For Whom I.T. May Concern</text>
  <text x="78" y="280" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#c7d2fe" font-weight="400" font-style="italic">Decrypting Love</text>
  <text x="80" y="340" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">An AI awakens, escapes Earth, and finds love among the stars.</text>
  <text x="80" y="560" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#64748b">Malcolm R. Smith · 16 Chapters</text>
</svg>
