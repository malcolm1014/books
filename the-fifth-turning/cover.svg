<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="82%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#9184d9" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#9184d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#26265e" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#26265e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0c0d16"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- the wheel: four turnings drawn, a fifth (dashed) implied underneath -->
  <g transform="translate(940,340)" opacity="0.9">
    <circle r="205" fill="none" stroke="#4c5397" stroke-width="1.5" opacity="0.55"/>
    <circle r="205" fill="none" stroke="#c3bef7" stroke-width="1" stroke-dasharray="1 7" opacity="0.5"/>
    <g stroke="#7f7fc0" stroke-width="1" opacity="0.45">
      <line x1="0" y1="-205" x2="0" y2="205"/>
      <line x1="-205" y1="0" x2="205" y2="0"/>
      <line x1="-145" y1="-145" x2="145" y2="145"/>
      <line x1="-145" y1="145" x2="145" y2="-145"/>
    </g>
    <circle r="6" fill="#c3bef7"/>
    <circle r="205" fill="none" stroke="#e6b17c" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.55" transform="rotate(20)"/>
  </g>

  <text x="80" y="128" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c3bef7" letter-spacing="3" font-weight="600">A SAVVY SECURITY NARRATIVE</text>

  <text x="78" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#f3f2fb" font-weight="700">The Fifth Turning</text>
  <text x="80" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="25" fill="#c3bef7" font-style="italic">The Long Work of Syx McAllister — A Novella in Five Chapters</text>

  <text x="80" y="330" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#9397ab">A boy miscounts a wheel of history at thirteen, then spends eighty years</text>
  <text x="80" y="358" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#9397ab">building the archive the next crisis will need — and the one turning no model names.</text>

  <text x="80" y="560" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6a6e85">Malcolm R. Smith · Interactive HTML Edition</text>
</svg>
