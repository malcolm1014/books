<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400&amp;display=swap');
    </style>
    <radialGradient id="bg" cx="50%" cy="78%" r="75%">
      <stop offset="0%" stop-color="#1a0b3a"/>
      <stop offset="45%" stop-color="#0a0718"/>
      <stop offset="100%" stop-color="#07060d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5ce1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff5ce1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4dfcff"/>
      <stop offset="100%" stop-color="#ff5ce1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- perspective grid floor -->
  <g stroke="#4dfcff" stroke-width="1" opacity="0.10">
    <line x1="0" y1="630" x2="500" y2="380"/>
    <line x1="150" y1="630" x2="550" y2="380"/>
    <line x1="300" y1="630" x2="600" y2="380"/>
    <line x1="450" y1="630" x2="650" y2="380"/>
    <line x1="600" y1="630" x2="700" y2="380"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="80" y1="500" x2="1120" y2="500"/>
    <line x1="160" y1="440" x2="1040" y2="440"/>
  </g>

  <circle cx="960" cy="200" r="360" fill="url(#glow)"/>

  <!-- glowing cross motif, right side -->
  <g transform="translate(985,300)">
    <rect x="-11" y="-115" width="22" height="230" rx="3" fill="url(#cross)" opacity="0.92"/>
    <rect x="-80" y="-31" width="160" height="22" rx="3" fill="url(#cross)" opacity="0.92"/>
    <rect x="-11" y="-115" width="22" height="230" rx="3" fill="none" stroke="#4dfcff" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- eyebrow -->
  <text x="80" y="120" font-family="IBM Plex Mono, monospace" font-size="15" fill="#c6ff3d" letter-spacing="5" font-weight="600">SAVVY SECURITY LLC PRESENTS</text>

  <!-- title -->
  <text x="76" y="240" font-family="Chakra Petch, Helvetica, Arial, sans-serif" font-size="104" fill="#ffffff" font-weight="700" letter-spacing="-1">JUSTICE</text>
  <text x="76" y="340" font-family="Chakra Petch, Helvetica, Arial, sans-serif" font-size="104" fill="#ffffff" font-weight="700" letter-spacing="-1">DESERVES</text>

  <!-- subtitle -->
  <text x="80" y="400" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="24" fill="#b9c0e0">A faith-and-firewall thriller</text>

  <!-- byline -->
  <text x="80" y="460" font-family="IBM Plex Mono, monospace" font-size="16" fill="#ff5ce1" letter-spacing="3">MALCOLM R. SMITH</text>

  <!-- footer meta -->
  <text x="80" y="560" font-family="IBM Plex Mono, monospace" font-size="14" fill="#6b7290" letter-spacing="4">SIX CHAPTERS · ~45 MIN READ</text>
</svg>
