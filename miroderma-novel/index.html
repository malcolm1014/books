    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only

      // and sender identity (own child frame / direct parent) is checked

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px;\">\n          <sc-for list=\"{{ cast }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <div style=\"border:3px solid #16483a; background:#0b1519; padding:18px;\">\n              <div style=\"font-family:'Press Start 2P',monospace; font-size:11px; color:{{ m.color }}; margin-bottom:6px;\">{{ m.name }}<\u002Fdiv>\n              <div style=\"font-size:18px; color:#4b7a68; letter-spacing:1px; margin-bottom:12px;\">{{ m.role }}<\u002Fdiv>\n              <div style=\"font-size:20px; line-height:1.5; color:#c8f7dc;\">{{ m.bio }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ filesOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ toggleFiles }}\" style=\"position:absolute; inset:0; z-index:70; background:rgba(4,7,10,.9); display:flex; align-items:center; justify-content:center; padding:40px;\">\n      <div style=\"max-width:820px; width:100%; max-height:100%; overflow-y:auto; border:4px solid #ff3ea5; background:#070d11; padding:30px;\">\n        <div style=\"font-family:'Press Start 2P',monospace; font-size:13px; color:#ff3ea5; margin-bottom:8px;\">/EVIDENCE/LEDGER<\u002Fdiv>\n        <div style=\"font-size:19px; color:#4b7a68; margin-bottom:22px; letter-spacing:1px;\">Append-only. {{ unlockedCount }} of {{ totalFiles }} entries decrypted at your current position.<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:12px;\">\n          <sc-for list=\"{{ files }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <div style=\"border:3px solid {{ f.border }}; background:#0b1519; padding:16px;\">\n              <div style=\"display:flex; gap:12px; align-items:baseline;\">\n                <div style=\"font-family:'Press Start 2P',monospace; font-size:10px; color:{{ f.border }};\">{{ f.code }}<\u002Fdiv>\n                <div style=\"font-size:19px; color:#4b7a68; letter-spacing:1px;\">{{ f.status }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:21px; line-height:1.5; color:#c8f7dc; margin-top:10px;\">{{ f.body }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ booting }}\" hint-placeholder-val=\"{{ true }}\">\n    <div sc-camel-on-click=\"{{ skipBoot }}\" style=\"position:absolute; inset:0; z-index:90; background:#04070a; padding:60px; font-size:22px; line-height:1.7; color:#39ff6a; cursor:pointer;\">\n      <sc-for list=\"{{ bootLines }}\" as=\"l\" hint-placeholder-count=\"3\">\n        <div style=\"letter-spacing:1px;\">{{ l.text }}<\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"margin-top:26px; font-family:'Press Start 2P',monospace; font-size:11px; color:#ffc247;\">{{ bootPrompt }}<span style=\"animation:blink 1s step-end infinite;\">█<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nconst BOOT = [\n  \"SAVVY SECURITY LLC // SECURE READER v1.0\",\n  \"> mounting /archive/miroderma ......... OK\",\n  \"> verifying chain-of-custody hashes ... OK\",\n  \"> decrypting manuscript (14 chapters) . OK\",\n  \"> POV router online ................... OK\",\n  \"> WARNING: contents not yet published.\",\n];\n\nconst CAST = [\n  { name: \"WREN\", role: \"HACKER // LAUGHING COLLECTIVE\", color: \"#39ff6a\", bio: \"Builds crowbars for doors that don't exist yet. Runs falsification passes on her own hypotheses before she lets herself believe them.\" },\n  { name: \"MARLOWE CHEN\", role: \"INVESTIGATIVE JOURNALIST\", color: \"#4de2ff\", bio: \"Keeps a three-column outline: Confirmed, Corroborated Once, Rumor. Moves nothing left without a second source who never met the first.\" },\n  { name: \"DESMOND OHARA\", role: \"DIR. APPLIED CRYPTO COMPLIANCE\", color: \"#ffc247\", bio: \"Eleven years inside the spiral. Noticed an unlocked door and said nothing, until the day he used it. Signs his leaks Halcyon-9.\" },\n  { name: \"AMBROSE CALLOWAY\", role: \"PRESIDENT\", color: \"#ff3ea5\", bio: \"Three companies before the office. Judges every briefing like a boardroom pitch, and chose the harder fire when the easy one was offered.\" },\n];\n\nconst FILES = [\n  { code: \"GLASSHOUSE\", at: 0, body: \"Unexplained Miroderma budget line. Six years. Quarterly. Growing. Routed through Verrine Logistics. Maps to no announced product.\" },\n  { code: \"VERRINE-01\", at: 1, body: \"Shell with a badge number attached. Listed as designated pass-through vendor on a federal liaison roster, line fourteen of an appendix.\" },\n  { code: \"RETENTION\", at: 3, body: \"Pre-merger archive retention window: INDEFINITE, SUBJECT TO FEDERAL REVIEW. Metadata only. Contents never cleared for civilian tier.\" },\n  { code: \"ROOM-3114\", at: 6, body: \"Q-clearance renewal review. Attendee list redacted from a director who outranks the room. Entered through the building's forgotten plumbing.\" },\n  { code: \"Q-DAY\", at: 12, body: \"Advance preparation for the evidentiary and prosecutorial implications of emergent decryption capability. Six years of patient spending.\" },\n  { code: \"NINTH NAME\", at: 40, body: \"Succession is not a person. It is a slot. Someone always fills it, and the mask does not care whose face is underneath.\" },\n];\n\nfunction segs(text) {\n  const out = [];\n  const re = /(\\*\\*[^*]+\\*\\*|\\*[^*]+\\*)/g;\n  let last = 0, m, k = 0;\n  while ((m = re.exec(text)) !== null) {\n    if (m.index > last) out.push({ key: k++, plain: true, text: text.slice(last, m.index) });\n    const t = m[0];\n    if (t.startsWith(\"**\")) out.push({ key: k++, bold: true, text: t.slice(2, -2) });\n    else out.push({ key: k++, em: true, text: t.slice(1, -1) });\n    last = m.index + t.length;\n  }\n  if (last < text.length) out.push({ key: k++, plain: true, text: text.slice(last) });\n  return out.length ? out : [{ key: 0, plain: true, text: text }];\n}\n\nclass Component extends DCLogic {\n  state = { booting: true, bootN: 0, chapters: [], idx: 0, home: true, castOpen: false, filesOpen: false, loaded: false };\n\n  componentDidMount() {\n    this.tick = setInterval(() => {\n      this.setState(s => {\n        if (s.bootN >= BOOT.length) { clearInterval(this.tick); return { bootN: s.bootN }; }\n        return { bootN: s.bootN + 1 };\n      });\n    }, 260);\n    this.bootTimer = setTimeout(() => this.setState({ booting: false }), 260 * BOOT.length + 900);\n\n    const inline = document.getElementById(\"novel-src\");\n    const source = inline ? Promise.resolve(inline.textContent) : fetch(\"novel.md\").then(r => r.text());\n    source.then(md => {\n      const chapters = this.parse(md);\n      let idx = 0;\n      try {\n        const saved = parseInt(localStorage.getItem(\"miroderma.act\") || \"0\", 10);\n        if (!isNaN(saved)) idx = saved;\n      } catch (e) {}\n      this.setState({ chapters, loaded: true, idx });\n    });\n\n    this.onKey = (e) => {\n      if (e.key === \"ArrowRight\" || e.key === \"Enter\" || e.key === \" \") { e.preventDefault(); this.go(1); }\n      else if (e.key === \"ArrowLeft\") { e.preventDefault(); this.go(-1); }\n      else if (e.key === \"c\" || e.key === \"C\") this.setState(s => ({ castOpen: !s.castOpen }));\n      else if (e.key === \"e\" || e.key === \"E\") this.setState(s => ({ filesOpen: !s.filesOpen }));\n      else if (e.key === \"Escape\") this.setState({ castOpen: false, filesOpen: false });\n    };\n    window.addEventListener(\"keydown\", this.onKey);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.tick); clearTimeout(this.bootTimer);\n    window.removeEventListener(\"keydown\", this.onKey);\n  }\n\n  parse(md) {\n    const lines = md.split(\"\\n\");\n    const chapters = [];\n    let ch = null, act = null, buf = [];\n    const flush = () => {\n      const t = buf.join(\" \").trim();\n      buf = [];\n      if (!t || !act) return;\n      if (/^\\*\\*THE END\\.\\*\\*$/i.test(t)) return;\n      if (/^\\*That closes the core arc/i.test(t)) return;\n      if (/Format note for Design|hand off to Design/i.test(t)) return;\n      act.paras.push({ key: act.paras.length, segs: segs(t) });\n    };\n    const newAct = (raw) => {\n      flush();\n      let head = raw, pov = \"\";\n      const pm = raw.match(/\\(([^)]*)\\)\\s*$/);\n      if (pm) { pov = pm[1]; head = raw.slice(0, pm.index).trim(); }\n      const parts = head.split(\" — \");\n      let label = parts[0].trim(), title = (parts[1] || \"\").trim();\n      if (!parts[1]) { title = label; label = \"SECTION\"; }\n      act = { label, title: title || label, pov, paras: [] };\n      ch.acts.push(act);\n    };\n    for (const line of lines) {\n      const l = line.trim();\n      if (l.startsWith(\"## \")) {\n        flush();\n        const title = l.slice(3).trim();\n        if (/FRONT MATTER/i.test(title)) { ch = null; act = null; continue; }\n        ch = { title, acts: [] };\n        act = null;\n        chapters.push(ch);\n      } else if (l.startsWith(\"### \")) {\n        if (!ch) continue;\n        newAct(l.slice(4).trim());\n      } else if (l === \"---\" || l.startsWith(\"# \")) {\n        flush();\n      } else if (l === \"\") {\n        flush();\n      } else if (ch && act) {\n        buf.push(l);\n      }\n    }\n    flush();\n    return chapters.filter(c => c.acts.length);\n  }\n\n  flat() {\n    const out = [];\n    this.state.chapters.forEach((c, ci) => c.acts.forEach((a, ai) => out.push({ c, ci, a, ai })));\n    return out;\n  }\n\n  go(d) {\n    if (this.state.castOpen || this.state.filesOpen) return;\n    if (this.state.booting) { this.setState({ booting: false }); return; }\n    const f = this.flat();\n    if (!f.length) return;\n    if (this.state.home) { this.jump(this.state.idx); return; }\n    const n = Math.max(0, Math.min(f.length - 1, this.state.idx + d));\n    this.jump(n);\n  }\n\n  jump(n) {\n    try { localStorage.setItem(\"miroderma.act\", String(n)); } catch (e) {}\n    this.setState({ idx: n, home: false }, () => {\n      const p = document.getElementById(\"readpane\");\n      if (p) p.scrollTop = 0;\n    });\n  }\n\n  povMeta(pov) {\n    const p = pov || \"\";\n    if (/Wren/.test(p)) return { name: \"WREN\", color: \"#39ff6a\", full: \"Wren — hacker, Laughing Collective\" };\n    if (/Marlowe/.test(p)) return { name: \"MARLOWE\", color: \"#4de2ff\", full: \"Marlowe Chen — investigative journalist\" };\n    if (/Desmond/.test(p)) return { name: \"DESMOND\", color: \"#ffc247\", full: \"Desmond Ohara — compliance, Miroderma\" };\n    if (/Calloway|President/.test(p)) return { name: \"CALLOWAY\", color: \"#ff3ea5\", full: \"President Ambrose Calloway\" };\n    if (/Multi/.test(p)) return { name: \"MULTI-POV\", color: \"#b9f6d2\", full: \"Multiple viewpoints, converging\" };\n    if (/Hacker/.test(p)) return { name: \"COLLECTIVE\", color: \"#39ff6a\", full: \"The Laughing Collective\" };\n    if (/Journalist/.test(p)) return { name: \"PRESS\", color: \"#4de2ff\", full: \"The newsroom\" };\n    if (/Corp Insider|Compliance/.test(p)) return { name: \"INSIDER\", color: \"#ffc247\", full: \"Inside the spiral\" };\n    return { name: \"ARCHIVE\", color: \"#6f9c8a\", full: p || \"Archive record\" };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const f = this.flat();\n    const cur = f[Math.min(s.idx, Math.max(0, f.length - 1))];\n    const meta = this.povMeta(cur ? cur.a.pov : \"\");\n    const pct = f.length ? Math.round(((s.idx + 1) / f.length) * 100) : 0;\n    const filled = Math.round(pct / 10);\n    let bar = \"\";\n    for (let i = 0; i < 10; i++) bar += i < filled ? \"\\u2588\" : \"\\u2591\";\n\n    const curCi = cur ? cur.ci : -1;\n    const chapters = s.chapters.map((c, ci) => ({\n      key: ci,\n      num: String(ci + 1).padStart(2, \"0\"),\n      short: c.title.replace(/^CHAPTER [A-Z]+: /, \"\").replace(/^EPILOGUE: /, \"EPILOGUE — \"),\n      isCurrent: ci === curCi && !s.home,\n      open: () => { const t = f.findIndex(x => x.ci === ci); if (t >= 0) this.jump(t); },\n      acts: c.acts.map((a, ai) => ({\n        key: ai,\n        mark: ai === (cur ? cur.ai : -1) ? \"\\u25B8\" : \"\\u00B7\",\n        label: a.title,\n        open: (ev) => { if (ev && ev.stopPropagation) ev.stopPropagation(); const t = f.findIndex(x => x.ci === ci && x.ai === ai); if (t >= 0) this.jump(t); },\n      })),\n    }));\n\n    const files = FILES.map((x, i) => {\n      const un = s.idx >= x.at;\n      return {\n        key: i,\n        code: un ? x.code : \"\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\",\n        status: un ? \"DECRYPTED\" : \"LOCKED — keep reading\",\n        border: un ? \"#ff3ea5\" : \"#16483a\",\n        body: un ? x.body : \"\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588 \\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588 \\u2588\\u2588\\u2588\\u2588 \\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588 \\u2588\\u2588\\u2588\\u2588\\u2588 \\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588 \\u2588\\u2588\\u2588\\u2588\\u2588\\u2588 \\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588\\u2588.\",\n      };\n    });\n\n    return {\n      booting: s.booting,\n      bootLines: BOOT.slice(0, s.bootN).map((t, i) => ({ key: i, text: t })),\n      bootPrompt: s.bootN >= BOOT.length ? \"PRESS ANY KEY TO JACK IN \" : \"LOADING \",\n      skipBoot: () => this.setState({ booting: false }),\n      chapters,\n      showHome: s.home,\n      showReader: !s.home && !!cur,\n      chapterTitle: cur ? cur.c.title : \"\",\n      actLabel: cur ? cur.a.label : \"\",\n      actTitle: cur ? cur.a.title : \"\",\n      povName: meta.name,\n      povFull: meta.full,\n      povBg: meta.color,\n      paras: cur ? cur.a.paras : [],\n      isFinal: !!cur && s.idx === f.length - 1,\n      progressBar: bar,\n      progressPct: pct + \"%\",\n      navHint: \"\\u2190 / \\u2192 to turn \\u00B7 C cast \\u00B7 E evidence\",\n      prev: () => this.go(-1),\n      next: () => this.go(1),\n      resume: () => this.jump(s.idx),\n      resumeLabel: s.idx > 0 ? \"RESUME\" : \"START READING\",\n      restart: () => this.jump(0),\n      goHome: () => this.setState({ home: true, castOpen: false, filesOpen: false }),\n      toggleCast: () => this.setState(x => ({ castOpen: !x.castOpen, filesOpen: false })),\n      toggleFiles: () => this.setState(x => ({ filesOpen: !x.filesOpen, castOpen: false })),\n      castOpen: s.castOpen,\n      filesOpen: s.filesOpen,\n      cast: CAST.map((c, i) => Object.assign({ key: i }, c)),\n      files,\n      unlockedCount: files.filter(x => x.status === \"DECRYPTED\").length,\n      totalFiles: FILES.length,\n    };\n  }\n}\n\n<\u002Fscript>\n\n<script id=\"novel-src\" type=\"text/plain\"># MIRODERMA GOT ME LAUGHING MAN!\n### A Cyberpunk Novel\n\n---\n\n## FRONT MATTER\n\n**Title:** Miroderma Got Me Laughing Man!\n**Genre:** Cyberpunk / Political Techno-Thriller\n**Audience:** Cybersecurity and cyberpunk readers\n**Format note for Design:** Single continuous manuscript, chronological, four rotating first/close-third POVs (hacker, journalist, corporate insider, president), plus a three-part epilogue for secondary characters. Structured in acts within chapters to support an interactive e-book build — each Act break below is a natural point for a chapter-navigation anchor, pull-quote, or interactive element (POV indicator, character-select view, etc.).\n\n**Logline:** When a hacker, a journalist, and a frightened compliance officer independently start pulling on the same thread inside a biotech-and-data conglomerate, they uncover a federal program quietly preparing for the day encryption itself breaks — and discover that the cost of exposing a secret this size isn't paid by institutions. It's paid, quietly and unevenly, by the people who refuse to look away.\n\n**Content notes:** Original characters and companies throughout. Institutional and political figures are invented for this story and not modeled on any real person or company.\n\n---\n\n### TABLE OF CONTENTS\n\n**PART ONE — THE SHAPE IN THE DARK**\n- Chapter One: Cascade\n- Chapter Two: The Maintenance Terminal\n- Chapter Three: The Name Behind the Shell\n- Chapter Four: The Overlap\n- Chapter Five: The Man Who Built the Room\n\n**PART TWO — WHAT THE COMPANY PROTECTS**\n- Chapter Six: The Company Looks After Its Own\n- Chapter Seven: Fault Lines\n- Chapter Eight: The Weight Each of Them Carried\n- Chapter Nine: The Room With No Masks Left\n- Chapter Ten: The Ninth Name\n\n**PART THREE — THE COUNTDOWN**\n- Chapter Eleven: The First Tremor\n- Chapter Twelve: Eighteen Months\n- Chapter Thirteen: The Door Opens\n- Chapter Fourteen: The Mask, Set Down\n\n**EPILOGUE — OTHERS WHO CARRIED IT**\n- I. Priya\n- II. Regina Alsted\n- III. The Ninth Successor\n\n---\n\n## CHAPTER ONE: CASCADE\n\n---\n\n### ACT I — The Long Grep (Hacker POV — \"Wren\")\n\nWren hadn't slept in the conventional sense for three days, but she'd dreamed plenty — the half-lucid kind that comes from running a distributed compute job across forty rented cores while your body forgets it's a body. The dream was always the same shape: a lattice, a key, a door that wouldn't open because the lock hadn't been invented yet. That was the joke of her whole life's work. She was building a crowbar for a door that didn't exist yet, betting that when it did, she'd be the first one through it.\n\nHer apartment — if you could call a shipping-container conversion stacked eleven high in the Perimeter Blocks an apartment — hummed with the low mechanical anxiety of hardware working too hard for too long. Three fans, two of them dying. A window that looked out on nothing but the underside of the block above, close enough to touch if the glass weren't reinforced. She liked it that way. No sky meant no surveillance drones parked lazily overhead, cataloguing thermal signatures for a rent she couldn't afford anyway.\n\nThe job running across her rented cores wasn't hers, not really — it belonged to a diffuse, headless thing that called itself, with the kind of self-aware irony that only really works over encrypted relay chat, the **Laughing Collective**. Nobody led it. That was the point, or at least that was the story everyone told about it, the story that made it impossible to arrest, subpoena, or decapitate. You couldn't cut the head off a hydra that insisted, credibly, that it didn't have one.\n\nWhat the Collective wanted from Wren was simple to describe and monstrous to execute: index, timestamp, and hash every publicly leaked or semi-leaked fragment of internal correspondence, patent filing, and shell-company transaction ever associated with Miroderma Biosystems, the sprawling dermal-therapeutics-and-data conglomerate whose logo — a stylized, smiling spiral — you could not walk six blocks in any city on Earth without seeing. The idea wasn't to break anything today. The idea was archival. Preservation. Because someday, someone, somewhere, was going to finish building a machine that could read what today's encryption made unreadable, and when that day came, everything currently locked would come open at once, all over the world, like a hundred million doors swinging on the same hinge.\n\nThey called that day Q-Day. Nobody Wren trusted claimed to know exactly when it would arrive. Estimates ranged from \"already happened and they're not telling us\" to \"comfortably after we're all dead.\" What mattered to Wren wasn't the date. What mattered was that whoever held the largest, cleanest, most rigorously chained-of-custody archive of *encrypted* material on that day would be the one who got to decide what the world learned first, and in what order, and with what framing. Information wasn't power. The **sequencing** of information was power. That lesson she'd learned from a show her father used to watch, half-legally streamed off a mirror site, about a hacker nobody could catch because there was no *him* to catch — just an idea, wearing the same laughing-face mask, replicated by a thousand strangers until the mask became realer than any single face underneath it.\n\nShe minimized the compute dashboard and opened a different window: a scraped, half-verified batch of procurement records that had come to her through four hops she didn't fully trust, ending in a source she trusted even less, a handle that only ever went by **Halcyon-9**. The records were dry as bone — line items, shipping manifests, subcontractor invoices — except for one recurring anomaly. A budget line, repeated quarterly for six years, routed through a shell called Verrine Logistics, that didn't map to any product Miroderma had ever announced, patented, or shipped. Just a number. Growing. Consistent. Patient.\n\nPatient spending, in Wren's experience, was the only kind of spending that ever actually meant something. Panic spending told you a company was reacting to a leak, a lawsuit, a scandal. Patient spending told you a company was *building* toward something it hadn't been forced to admit yet. Six years of an unexplained, steadily growing line item wasn't a smoking gun. It wasn't even a fingerprint. It was a shape in the dark that you could only see because you'd been staring at the dark long enough to notice when it moved.\n\nShe flagged the anomaly, tagged it with a provisional codename — **GLASSHOUSE** — and pushed it into the Collective's shared ledger, the encrypted, append-only archive that no single member, including her, could unilaterally alter or delete. That was the whole architecture of the thing: no leaders, no deletions, no single point of failure or blame. A stand-alone complex, if you wanted the old term for it. A crowd that moved with apparent purpose despite having no conductor, each member independently arriving at similar conclusions because the conditions that produced those conclusions were shared, not because anyone had told them what to think.\n\nHer terminal chimed — not the compute job, something else. A relay ping, four hops deep, the kind of contact that only ever meant one of two things: a new lead, or trouble. She opened it.\n\n*Wren. You need to see what Marlowe's been digging on the journalism side. Verrine Logistics isn't just a shell. It's a shell with a badge number attached. — H9*\n\nShe sat with that for a long moment, watching the cursor blink, feeling the particular vertigo of a puzzle piece sliding into a shape she hadn't been ready to see yet. A badge number. Not a private security contractor. Not a corporate fixer. A badge number meant government, and government meant the story she'd been quietly assembling for two years had just grown teeth she hadn't accounted for.\n\n---\n\n### ACT II — Bylines and Blind Alleys (Journalist POV — \"Marlowe\")\n\nMarlowe Chen had learned, the hard way, that the most dangerous sentence in investigative journalism wasn't *we can't confirm this* — that sentence, at least, was honest. The dangerous sentence was *we don't need to confirm this, everyone already believes it.* That sentence got people killed, got outlets sued into oblivion, and worse, got the *true* stories buried under the landfill weight of a thousand false ones that had gotten there first, loud and confident and wrong.\n\nWhich was why she was sitting in a public library — the analog kind, paper books, no active network drop, the last genuinely dead zone in the city that hadn't been converted into luxury micro-units — cross-referencing a leaked procurement record against nineteen years of public filings, using nothing but her own eyes, a legal pad, and the stubborn conviction that somewhere in the gap between what Miroderma said publicly and what it filed privately, there was a fact instead of a feeling.\n\nThe tip had come, as most of her good tips did lately, through a dead-drop relay that terminated in a handle she'd never see a face behind: Halcyon-9. She'd stopped asking who was behind the handles years ago. It wasn't professional caution, exactly — it was closer to a philosophical position she'd arrived at after watching enough sources burn. In a world where any identity could be borrowed, discarded, or worn by a rotating cast of people using the same login credentials, *who* someone was mattered less than *what they could prove.* The mask was real. The face underneath was a distraction.\n\nWhat Halcyon-9 had sent her wasn't the anomalous budget line itself — that had gone to the hacker side of this loose, unspoken coalition — but something adjacent: a partially redacted contractor roster for a federal liaison office whose stated purpose, on paper, was \"advanced materials procurement oversight.\" Buried in line fourteen of an appendix nobody was supposed to read past line three was a name that made Marlowe's pen stop moving: **Verrine Logistics**, listed as a \"designated pass-through vendor,\" with a badge-numbered point of contact instead of a corporate one.\n\nGovernment agencies used shell logistics companies for all kinds of boring, legal reasons — classified procurement, deniable diplomatic supply chains, black-budget line items that Congress technically approved without technically reading. That wasn't, by itself, a story. A private biotech conglomerate's unexplained six-year spending pattern routing through the *same* shell that a federal liaison office used as a \"designated pass-through vendor\" — that was the beginning of a story, the kind that took eighteen months, four editors telling you to drop it, and one very good libel lawyer to actually publish.\n\nShe thought, not for the first time, about the old anime her father had loved, the one about the hacker with no face who became a legend precisely *because* nobody could pin a single identity to the crimes attributed to him — copycats layering over copycats until the \"truth\" of who he was became structurally unknowable, a stand-alone complex of imitation with no original left at the center. She'd always found the show a little too clever for its own good as a teenager. Now, staring at a redacted federal roster that connected a smiling dermatology conglomerate to a badge number nobody would confirm or deny, she understood it as something closer to a warning label.\n\nBecause here was the trap, and she felt it closing around her own reporting in real time: the more compelling a hidden-conspiracy narrative felt, the more it *wanted* to be believed on vibes alone, and vibes were exactly what got reporters — and hacktivist collectives, and grieving families, and entire political movements — marching confidently in a direction that turned out to be a mirror built by someone who understood human pattern-matching better than any of them did. She wasn't going to run this on vibes. She needed the badge number. She needed a name behind Verrine Logistics that existed in more than one document, verified by more than one source who didn't already agree with each other before they started looking.\n\nHer burner terminal — the one she used only in the dead zone, only ever for a handful of minutes at a time — buzzed once. A single line from Halcyon-9, no context, no pleasantries: *Ask Miroderma's press office about Q-clearance renewal cycles. Watch which syllable they stumble on.*\n\nIt was, Marlowe thought, an absurdly specific instruction, the kind that only made sense if you already knew the answer and wanted someone else to discover it independently, cleanly, without contamination from your own certainty. She respected that discipline more than she trusted the source. She wrote the question down on a fresh line of the legal pad: *Q-clearance renewal — dermatology company? Why would that even come up.*\n\nBy the time she left the library, the sun had dropped behind the arcology towers downtown, throwing the whole block into a blue-grey dusk lit mostly by Miroderma's rooftop signage — that same smiling spiral, forty stories tall, patient and unblinking, watching the city the way it had watched it for a decade without anyone stopping to ask what, exactly, a skincare company needed with a federal badge number in its supply chain.\n\nShe had eighteen months of runway on this story if she was careful, and roughly zero patience left for careful. Somewhere between those two numbers was where she actually lived now, and had for longer than she liked to admit.\n\n---\n\n### ACT III — The View From Inside the Spiral (Corp Insider POV — \"Desmond Ohara\")\n\nDesmond Ohara had a corner office on the thirty-first floor of Miroderma's Northgate campus, a title — Director of Applied Cryptographic Compliance — that had taken him eleven years to earn and meant, in practice, that he was the man responsible for making sure the company's encrypted archives stayed encrypted for exactly as long as legal counsel needed them to and not one day longer. It was, on paper, a job about math. In practice, it was a job about knowing precisely which conversations to have in a room without a network drop.\n\nHe'd joined Miroderma believing, with the sincerity of a much younger man, that dermatological and regenerative therapeutics represented one of the last genuinely optimistic frontiers of applied science — a company that could make burn victims whole again, that could regrow what fire and violence and time had taken, and that his own narrow expertise in lattice-based cryptography was simply the plumbing that kept the company's decades of proprietary research safe from competitors and thieves. That belief had not evaporated all at once. It had eroded the way most inconvenient beliefs erode inside large institutions: one reasonable-sounding request at a time, each one small enough to swallow without choking, until one day you looked up and realized you'd swallowed something enormous without ever once being asked to.\n\nThe request that sat heaviest with him now had come eighteen months ago, routed through a liaison office he'd never heard of before and had learned, since, to never mention by its full name in any written channel. The ask had been framed, at the time, as routine: migrate a specific tranche of the company's oldest archived research — pre-merger records, dating back to before Miroderma's founding entity had absorbed a smaller regenerative-medicine startup — onto a storage architecture \"compliant with forthcoming federal quantum-resistance standards.\" Boring. Bureaucratic. The kind of request that generated a line item and nothing else.\n\nExcept the budget for that migration had kept growing, quarter over quarter, long after any reasonable migration should have finished, and it had started routing — Desmond had only noticed this himself six weeks ago, and had told no one, because telling someone required deciding *who* — through a logistics shell called Verrine, whose invoices described nothing that corresponded to any actual physical shipment he could locate in the building's own receiving logs.\n\nHe understood, better than almost anyone in the building, what \"quantum-resistant\" actually meant, and he understood, with the specific dread of a man whose entire career was built on a countdown clock, what its inverse implied: if you were spending six years and an unexplained fortune making something quantum-*resistant*, it was because you believed, with more confidence than the public conversation reflected, that something quantum-*capable* was closer than anyone was admitting on the record. You didn't armor a door against a battering ram nobody owned yet unless you'd seen the ram, or built it, or been told by someone with better information than you that it was already in the yard.\n\nThe pre-merger archive itself was the part that kept him up nights that had nothing to do with work at all. He'd never had clearance to view its contents directly — that alone was strange, in a building where his clearance level was supposed to be near the top of the civilian tier — but he'd seen the metadata, the file-size envelopes, the retention schedule, and the retention schedule was the tell. Standard proprietary research got a retention window measured in decades, tied to patent life and regulatory requirements. This archive's retention window was marked, in a field he wasn't supposed to have access to but had, through a permissions misconfiguration eight months ago, *indefinite, subject to federal review.*\n\nHe had not told his wife. He had not told his director. He had, three weeks ago, in a moment of genuinely uncharacteristic recklessness, sent four lines of carefully sanitized metadata — no file contents, nothing that could be traced to a specific system, just the shape of the retention schedule and the phrase \"subject to federal review\" — through a relay he'd found, with some difficulty, described on a forum as trustworthy by people he had no way of actually verifying. He had signed it, out of some half-ironic, half-desperate impulse he didn't fully understand even now, with a handle borrowed from a show he'd loved as a teenager: **Halcyon-9**.\n\nHe didn't know who received those four lines. He didn't know if they'd been believed, ignored, or laughed at as an obvious plant. What he knew, sitting alone in his corner office at eight in the evening with the building mostly emptied out around him and that smiling spiral logo glowing faintly through his own window's reflection, was that he'd crossed a line he couldn't uncross, in the smallest possible increment, and that the only thing standing between him and finding out whether that had been brave or catastrophically stupid was whoever picked up the signal on the other end.\n\nHis terminal, on the secure internal network, flagged a routine calendar update: a Q-clearance renewal review, scheduled for next week, attendees redacted from his own visibility despite his clearance level. He stared at it for a long time before closing the window, and for the first time in eleven years, he found himself wondering whether the company he'd help protect for over a decade had ever actually been protecting *him*, or simply protecting itself from him, all along, patiently, the way you'd protect anything you intended to spend rather than keep.\n\n---\n\n### ACT IV — Signal in the Noise (Hacker POV — \"Wren\")\n\nWren read Halcyon-9's four sanitized lines three times before she let herself believe they meant what they appeared to mean. *Retention window: indefinite, subject to federal review.* On its own, that phrase was a fragment, unverifiable, easy to dismiss as noise — every archive of any size accumulated administrative debris like that, ambiguous flags left over from some long-forgotten compliance sweep. But fragments weren't dangerous individually. They were dangerous in aggregate, the way a single grain of sand told you nothing and a dune told you everything about which way the wind had been blowing for a decade.\n\nShe pulled the Collective's shared ledger back up and laid the new fragment beside GLASSHOUSE, beside the badge-numbered contact on the federal liaison roster Marlowe's side of the network had surfaced, beside a dozen smaller anomalies other contributors — people she'd never spoken to directly, would likely never meet, bound to her only by shared access to the same append-only archive — had logged over the preceding months without any of them coordinating in real time. That was the architecture doing exactly what it was designed to do: independent observers, working from a shared and growing body of evidence, converging on the same shape without anyone directing them toward it.\n\nIt was also, she reminded herself with the discipline of someone who had watched enough movements curdle into cults of certainty, exactly the mechanism by which a *false* shape could emerge just as convincingly as a true one. A stand-alone complex didn't care whether the pattern it amplified was accurate. It cared only that enough independent nodes agreed the pattern was there. The show her father loved had made that its whole tragic engine: a movement built entirely out of imitation could accomplish real things, terrify real institutions, topple real careers, without there ever having been a real, singular truth underneath it to begin with. Belief, replicated widely enough, could function exactly like fact, right up until the moment it didn't.\n\nSo she did the thing that separated her, in her own private accounting, from the version of herself that would have simply broadcast GLASSHOUSE to every channel she had access to and let the internet's appetite for a villain do the rest. She slowed down. She went looking, specifically and skeptically, for the piece of evidence that would *disprove* the pattern rather than confirm it, because a hypothesis that couldn't survive someone actually trying to kill it wasn't a hypothesis worth building an accusation on.\n\nThe disproof she went looking for was simple: if Verrine Logistics was a legitimate pass-through vendor for entirely mundane federal procurement, unrelated to Miroderma's own budget line, there should be a clean, boring explanation for why two completely unconnected entities happened to route six years of spending through the same obscure shell. Coincidences like that happened. Shell companies got reused by multiple clients for the same boring reason all shells got reused — because setting up a new one cost money and drew more attention than piggybacking on an existing, unremarkable one.\n\nShe spent the next six hours doing the least glamorous work imaginable: tracing Verrine's registration history, its filed officers, the notary chains on its incorporation documents, looking for any evidence that it served other, unrelated clients in the ordinary boring way shells sometimes did. She found nothing. Not \"found nothing suspicious\" — found *nothing at all.* No other clients, no other invoices, no digital footprint beyond the narrow, specific channel connecting a federal liaison office to a biotech conglomerate's unexplained six-year spend. A shell company that existed for exactly one purpose was not, in her experience, a coincidence. It was a dedicated pipe, built and maintained for a single relationship, disguised as something more mundane.\n\nThat didn't prove what the pipe carried. It didn't prove Desmond-who-she-didn't-yet-know-was-named-Desmond's four sanitized lines about an indefinite retention window meant what her gut wanted them to mean. It proved, at the level of rigor she actually trusted, that something real and deliberately obscured connected these two institutions, and that the obscuring had been expensive enough and patient enough that whoever built it expected the relationship to matter for a very long time — long enough, perhaps, to still matter on whatever day encryption itself stopped being able to keep a secret.\n\nShe logged the disproof attempt and its failure into the shared ledger alongside GLASSHOUSE, appending a note in the dry, deliberately unemotional register the Collective had adopted as house style, precisely to resist the gravitational pull of its own excitement: *Attempted to falsify single-purpose-shell hypothesis. Falsification failed. Confidence increased, not confirmed. Recommend continued independent verification before any external disclosure.*\n\nIt was two in the morning by the time she finished, and the compute job she'd started three days earlier had finally completed its long, patient crawl through the archive of everything Miroderma had ever leaked or half-leaked into the public record. The output sat waiting in a directory she hadn't opened yet, forty gigabytes of cross-referenced, hashed, timestamped material that had taken the collective effort of dozens of strangers, none of whom had ever met, to assemble — a monument, in its way, to the same principle the old anime had dramatized: that a crowd without a leader could still build something with the shape of intention, for better or worse, and that the only real question left was what would happen on the day the locks finally opened.\n\nShe didn't open the directory yet. Instead, she sent one line back through the relay to Halcyon-9, the first message she'd sent that handle in the two years of this loose, distant, entirely trust-based relationship: *We're going to need to know who you are eventually. Not today. But eventually.*\n\n---\n\n### ACT V — Convergence (Multi-POV Close)\n\nThree separate terminals, in three separate parts of a city none of them fully saw the shape of, went quiet within the same ninety-second window, though none of the three people at those terminals knew that the other two existed as anything more than handles and hearsay.\n\nMarlowe closed her legal pad and looked, for a long moment, at the question she'd written and underlined twice: *Q-clearance renewal — dermatology company? Why would that even come up.* She didn't have an answer yet. She had, for the first time in eighteen months of chasing a story that four editors had told her to abandon, something better than an answer: a question specific enough that someone with the truth would have to actively lie to avoid confirming it, and lies, unlike silence, left fingerprints.\n\nDesmond sat alone in his corner office, watching the smiling spiral logo glow faintly through his own reflection in the window glass, and made a decision he would spend a long time afterward unable to fully explain even to himself: he opened his calendar, found the redacted Q-clearance renewal review scheduled for the following week, and — carefully, using none of his own credentials, routing instead through a maintenance terminal in an empty conference room three floors down that he had, with quiet and deliberate patience over the preceding eight months, made sure retained old, unrevoked access — requested to sit in.\n\nWren opened the forty-gigabyte directory at last, the accumulated weight of dozens of strangers' patient, unglamorous archival labor, and began, methodically, to read.\n\nNone of the three of them knew yet that the badge number connected to Verrine Logistics traced back to an office whose stated mandate included, in language buried deep enough in its founding charter that even most of its own analysts had never read it closely, \"advance preparation for the evidentiary and prosecutorial implications of emergent decryption capability\" — a phrase that meant, in the plain language none of the three had access to yet, that somewhere in the federal apparatus, a small and deliberately obscure office had spent six years quietly preparing not to *create* evidence, but to know exactly what to do with an ocean of it the instant the locks came open.\n\nWhether that office intended justice or something considerably less noble than justice was not a question any of the documents Wren, Marlowe, or Desmond had touched so far could answer. That was, in its way, the oldest problem the old story about the laughing hacker had ever posed, dressed up now in newer, colder technology: a movement, an office, an archive could all look, from the outside, exactly like whatever the observer most needed or feared it to be, right up until the moment someone finally opened the door and everyone found out, all at once, together, what had actually been on the other side.\n\nThe smiling spiral logo kept glowing over the city, patient as it had always been, unbothered by any of it.\n\nSomewhere in a directory that had taken dozens of strangers months to build, a hash matched a fragment, matched a badge number, matched a retention schedule marked indefinite, and a shape that had been forming in the dark for six years took one more step toward becoming visible — not proven yet, not published yet, but no longer entirely deniable either.\n\nThree people who had never met went to sleep, or didn't, in three different corners of the same waiting city, each of them now carrying a piece of a picture none of them could see whole, bound together by nothing more solid than shared curiosity, shared risk, and a story about a laughing man that none of them had ever fully outgrown.\n\n**End of Chapter One.**\n\n---\n\n## CHAPTER TWO: THE MAINTENANCE TERMINAL\n\n---\n\n### ACT I — Borrowed Access (Corp Insider POV — \"Desmond Ohara\")\n\nThe maintenance terminal on the twenty-eighth floor lived in a conference room nobody had booked in over a year, a fact Desmond had confirmed methodically over eight months of quiet, deniable curiosity before he ever let himself consider using it for anything real. The room had been decommissioned from the building's active reservation system after a floor renovation shifted the \"innovation hub\" two levels up, and in the shuffle, someone in facilities had forgotten to revoke the old AV terminal's network credentials — a low-privilege account, technically, but one that had never been swept off an internal calendar-sync whitelist that predated the company's last three security audits.\n\nHe had found the gap by accident, doing exactly the kind of dull compliance sweep his job actually consisted of most days, and he had done the thing that eleven years at Miroderma had trained him, almost against his own conscience, not to do: he had said nothing. He hadn't reported it. He had simply noted it, privately, in the specific and cowardly way a person notes an unlocked door in a house they don't yet know if they'll ever need to rob.\n\nTonight he used it. He told himself, walking down the empty twenty-eighth floor with his badge deliberately left upstairs in his coat pocket, that he was only requesting to observe — an RSVP to a calendar event, nothing more, the kind of administrative footprint that could plausibly be explained a dozen boring ways if anyone ever asked. He did not let himself think, yet, about what came after the RSVP was accepted, because the part of him that had sent four sanitized lines to a stranger through an untraceable relay three weeks ago had apparently decided, without consulting the rest of him, that there would be an after.\n\nThe request went through cleanly — too cleanly, which worried him more than a rejection would have. A properly secured system should have flagged a maintenance-tier credential requesting attendance at a Q-clearance renewal review and kicked the request to a human for review. Instead it simply confirmed, the way a system confirms something it was never configured to consider unusual, because whoever had built the security model around this particular review had apparently never imagined anyone would try to get in through the building's forgotten plumbing.\n\nThat, more than anything else so far, told him something important about the people on the other side of this. They were careful about the front door — badge logs, clearance tiers, redacted attendee lists — and had never once considered that a patient man with eleven years of institutional memory might find a side entrance nobody had thought to lock. It was, in its narrow way, reassuring. It meant he wasn't dealing with an omniscient apparatus. He was dealing with an ordinary bureaucracy that had gotten very good at controlling the parts of the story it had thought to control.\n\nHe spent the rest of that night doing nothing dramatic at all — the opposite, in fact, of every heist his imagination kept unhelpfully supplying him with. He went home. He made dinner for his wife, who asked why he seemed distracted, and he told her, truthfully as far as it went, that a compliance deadline was weighing on him. He did not sleep well, but he had not slept well in three weeks, and by now the exhaustion had become just another texture of his days rather than a crisis in itself.\n\nIn the morning he went to work as he always did, badged in at the front entrance as he always did, and spent six unremarkable hours on the actual compliance work that was, in fact, still his job, still real, still something he was good at and had once been proud of. He found, somewhat to his own surprise, that he could hold both things at once — the ordinary competent version of himself that Miroderma had every reason to trust, and the other version, quieter, newer, that had RSVP'd to a meeting he wasn't supposed to be able to attend.\n\nAt 4:47 PM, an internal notification confirmed his attendance for the following Tuesday's Q-clearance renewal review, room 3114, floor thirty-one — his own floor, absurdly, four doors down from his own office, in a conference room he had walked past perhaps a thousand times in eleven years without ever once being invited inside.\n\nHe closed the notification and sat very still for a while, listening to the building's ambient hum, the same hum that had always meant safety to him before and now meant something closer to held breath. Four days. He had four days to decide whether showing up to that room was the bravest thing he'd ever do, or the last mistake he'd ever get to make inside these walls.\n\nHe did not send anything to Halcyon-9's relay that night. Some decisions, he'd realized, needed to be made alone first, and confessed to strangers only after they were already irreversible.\n\n---\n\n### ACT II — The Room Nobody Talks About (Corp Insider POV — \"Desmond Ohara\")\n\nRoom 3114 did not look, from the outside, like a place where anything of consequence happened. It had the same beige-and-glass Miroderma house style as every other conference room on the floor, the same smiling-spiral logo etched discreetly into the frosted glass door, the same faintly antiseptic smell of a space that got cleaned every night whether or not anyone had used it. Desmond had walked past this door literally hundreds of times without a second thought, and it occurred to him now, waiting outside it four minutes early on Tuesday morning, that this was probably the entire design philosophy behind hiding something inside a corporation this large: not vaults and armed guards, but the sheer, numbing ordinariness of beige carpet.\n\nHe badged in — his own badge this time, no maintenance-terminal trick necessary now that the calendar system had already accepted him as a legitimate attendee — and the door unlocked with the same unremarkable chime as every other door on the floor. Inside, six people were already seated around an oval table, none of whom he recognized, all of whom looked at him with the specific, controlled blankness of people who had been told an eighth attendee would be joining and had decided, collectively and without discussion, not to ask why.\n\nAt the head of the table sat a woman introduced only as \"Director Ashford, Federal Liaison,\" a title so deliberately uninformative it told him almost nothing except that she outranked everyone else in the room by a margin wide enough that nobody bothered clarifying further. She did not seem surprised to see him. That, more than anything else, was the detail that would keep him awake again that night — not suspicion, not hostility, just a flat, incurious acknowledgment, as though his presence had already been priced into whatever was about to happen.\n\nThe review itself began in language so dense with internal acronyms and compliance-speak that Desmond, despite eleven years of fluency in exactly this kind of language, had to work to follow it. But beneath the bureaucratic surface, a shape emerged steadily over the next forty minutes, the same way Wren's shape had emerged from a dune of individually meaningless grains of sand: this was not, primarily, a security review. It was a **capability assessment** — a periodic accounting of how close a specific federal research initiative had come to a stated technical milestone, cross-referenced against a private-sector partner's own parallel progress on cryptographic migration.\n\nMiroderma, it became clear without anyone in the room ever saying so directly, was not merely a company that happened to be targeted by federal procurement. It was a **funded partner**, quietly, in a joint initiative whose stated purpose — read aloud, without apparent irony, from a briefing slide titled *Evidentiary Readiness Program: Quarterly Capability Review* — was to prepare a chain-of-custody framework robust enough to survive prosecutorial scrutiny for evidence that did not yet exist in readable form, because the encryption protecting it had not yet been broken.\n\nDesmond understood, sitting very still in a chair he had no legitimate right to occupy, that he was watching the answer to Marlowe's unasked question about Q-clearance renewals assemble itself in real time, four floors and one hallway away from an office he had occupied in blissful ignorance for over a decade. The pre-merger archive he'd never had clearance to view, the one with the indefinite retention window — it wasn't an oversight. It was **evidence in waiting**, formally designated as such, sitting inside his own company's infrastructure because someone, years ago, had decided Miroderma's storage architecture was the most secure available holding pen for material the government could not yet read but had every intention of reading eventually.\n\nWhat the material actually contained, nobody in the room said aloud, and Desmond understood with a cold, settling certainty that this omission was not an accident either — that even Director Ashford, even the six analysts around this table, might not themselves know, might be operating on a strict need-to-know compartmentalization where the *existence* of the archive was cleared at their level and its *contents* were not, a design so deliberately layered that no single person in the building, possibly no single person in the entire joint initiative, held the whole picture.\n\nHe thought of the four sanitized lines he'd sent through Halcyon-9's relay three weeks ago, the ones that had felt, at the time, like the most reckless thing he'd ever done. Sitting in this room now, he understood they had barely scratched the surface of what was actually happening beneath his own floor, and he felt, for the first time since this had started, something closer to fear than curiosity — not fear of being caught, though that fear was real too, but fear of the plain fact that an ocean of irreversible legal consequence was being prepared, patiently and legally and with full institutional cover, for a day that hadn't arrived yet, aimed at targets nobody in this room had been told the names of.\n\nThe meeting ended the way it began, with bureaucratic blandness reasserting itself over the shape that had briefly become visible beneath it — a scheduling note for the next quarterly review, a reminder about badge-return protocols for departing contractors, Director Ashford thanking everyone for their time in a tone that suggested she had already mentally moved on to whatever came after this room. Desmond filed out with the others, badged back into the ordinary hallway, and walked the four doors back to his own office on legs that did not entirely feel like his.\n\nHe sat down at his desk, closed his door — an act so mundane it should not have felt as significant as it did — and for a long time simply breathed, turning over the phrase *Evidentiary Readiness Program* in his mind like a stone he couldn't put down. Then, finally, he opened the relay to Halcyon-9's handle and began composing a message considerably longer than four sanitized lines, understanding as he typed that he had crossed, fully and now irreversibly, from a man who noticed unlocked doors into a man who had walked through one.\n\n---\n\n### ACT III — What the Journalist Heard Back (Journalist POV — \"Marlowe\")\n\nMarlowe had asked Miroderma's press office about Q-clearance renewal cycles exactly the way Halcyon-9 had suggested, framing it as an offhand, almost throwaway question buried in the middle of an otherwise routine inquiry about the company's quarterly earnings call — and the response she got back, forty-one minutes later, told her more through its speed than anything it actually said. Press offices at companies the size of Miroderma did not answer offhand questions in forty-one minutes. They answered them in three to five business days, if they answered them at all, unless something about the specific question had triggered an escalation path that skipped the usual queue entirely.\n\nThe response itself was a masterpiece of saying nothing while appearing to say something, the kind of statement Marlowe had learned, over a decade of practice, to read the way a doctor reads an X-ray — not for what was visible, but for the shape of what had been carefully excluded from the frame. *\"Miroderma Biosystems maintains full compliance with all applicable federal data security and procurement standards, including those governing emerging cryptographic technologies. We do not comment on the specifics of individual contractual relationships.\"* She read it four times, and each time the sentence *\"including those governing emerging cryptographic technologies\"* sat there like a confession dressed as boilerplate — nobody volunteered that clause unprompted unless the underlying question had landed closer to the truth than the asker herself had realized.\n\nShe spent the rest of the afternoon doing the unglamorous work that made the difference between a hunch and a story: pulling every public SEC filing Miroderma had submitted in the last six years, cross-referencing risk-disclosure language for any mention of \"quantum,\" \"cryptographic,\" or \"federal partnership\" that hadn't shown up in her earlier passes. She found three instances, each buried in dense boilerplate risk sections that virtually no retail investor ever read past the first paragraph of, each one vague enough to be technically true and specific enough, in hindsight, to have been trying to satisfy a disclosure obligation without actually disclosing anything a normal reader would understand.\n\nThe pattern that emerged wasn't proof of anything criminal — Marlowe was careful, even in her own private notes, never to let herself round up to that word before the evidence earned it — but it was proof of a **relationship**, formal, ongoing, and deliberately obscured from ordinary public scrutiny while technically satisfying the letter of federal disclosure law. That distinction mattered enormously to her, more than it would matter to a reader scanning for a villain. A relationship hidden in plain sight, satisfying disclosure law's letter while defeating its spirit, was a story about institutional opacity. A criminal conspiracy was a much bigger, much more dangerous claim to make, and she did not yet have anything close to the evidence required to make it responsibly.\n\nShe called her editor, Priya, for the first time in six weeks, and instead of the usual \"still working it\" update, laid out what she actually had: an unusually fast, unusually specific press response; three buried SEC risk disclosures; and a secondhand, unverified claim from an anonymous source about an indefinite-retention archive \"subject to federal review.\" Priya, to her credit, didn't tell her to drop it this time. Priya asked the question that mattered most: *\"What do you need to make this publishable, and how do we get it without burning the source?\"*\n\nThat question sat with Marlowe longer than she expected it to, because it forced her to confront the actual shape of the problem rather than the shape she wanted it to have. She needed, at minimum, two independently corroborating sources for the retention-schedule claim, ideally one of them on the record or at least willing to be characterized specifically enough that a reader could weigh their credibility. She needed a name — any name — behind Verrine Logistics that existed in a filing she could cite rather than a rumor she'd been handed. And she needed, more than either of those, to resist the pull of a narrative that was already, in her own head, assembling itself faster and more confidently than her actual evidence justified.\n\nShe thought again, sitting at her desk that evening with the city's lights coming up outside her window, about the old anime and its stand-alone complex — a phenomenon that had always struck her, even as a teenager, as being less about hackers and conspiracies and more about the terrifying ease with which a compelling shape, repeated by enough independent, sincere people, could come to function as truth whether or not a truth had ever actually been sitting underneath it. She did not want to be one more sincere, independent node amplifying a shape because it *felt* inevitable. She wanted to be the node that made the shape survive contact with scrutiny, or that killed it cleanly if it couldn't.\n\nShe drafted, and did not send, a message back through the relay to Halcyon-9: *I need a name, a document, or a second source. A feeling isn't a story, even a true one.* She sat with the cursor blinking over the send button for nearly ten minutes before finally committing it, aware that she was, in her own small way, asking a frightened and anonymous person to take on more risk than she had any right to ask of them — and aware, too, that she would ask it anyway, because the alternative was publishing something she couldn't defend, and she had watched too many careers, too many outlets, too many public trust accounts get spent on exactly that mistake.\n\nThe message sat unanswered for six hours, long enough that she assumed, with a familiar and specific kind of disappointment, that she'd pushed too hard and lost the thread entirely. Then, just past midnight, a reply came through — not from Halcyon-9's usual terse, cryptic register, but longer, less controlled, the writing of someone who had clearly crossed some internal threshold earlier that same day and hadn't yet decided how to feel about it.\n\n---\n\n### ACT IV — The Long Message (Corp Insider POV — \"Desmond Ohara\" / Journalist POV — \"Marlowe,\" interleaved)\n\nDesmond wrote for almost forty minutes before he let himself send anything, drafting and deleting and redrafting the same handful of paragraphs, aware with every keystroke that he was making a decision considerably larger than the four sanitized lines he'd sent three weeks earlier. He did not name the program. He did not name Director Ashford, or describe the room, or use any detail specific enough to be traced back to a single meeting on a single floor of a single building on a single date. What he wrote instead was the shape of what he'd learned, stripped of every identifying particular he could strip without also stripping it of meaning — a discipline that took him most of those forty minutes to actually achieve.\n\n*There is a formally designated program, joint between a private-sector partner and a federal office, whose stated purpose is preparing chain-of-custody standards for encrypted material that cannot currently be read. The material exists. Its retention is indefinite. Nobody at the working level, as far as I could tell, has been told what it actually contains. I believe compartmentalization is deliberate and multi-layered, possibly extending above the people I observed today.*\n\nMarlowe read the message twice before she let herself react to it at all, applying the same discipline she'd have applied to any anonymous tip from any source she'd never met in person, however much the specificity and evident personal risk in the writing pulled at her sympathy. An unnamed program. An unnamed room. A claim of \"formally designated\" status with nothing yet to formally designate it by — no document, no filing number, no name she could put in front of an editor and say *here, corroborate this.* It was, by every professional standard she held herself to, not yet a source she could build a story on. It was, by every human standard she also held herself to, the most frightened and sincere message she'd received in eighteen months of chasing this thread.\n\nShe wrote back carefully, resisting the urge to ask for everything at once, understanding that whoever was on the other end of this relay had just taken a risk large enough that pushing too hard, too fast, could either silence them permanently or push them into a mistake that got them caught. *Thank you for trusting me with this. I need you to know I can't publish anything from this alone — not because I don't believe you, but because \"I believe you\" isn't the standard that protects either of us. If there's ever a document, a name, anything with an edge I can hold onto, I'll wait as long as it takes. Are you safe right now?*\n\nThe question *are you safe right now* sat on Desmond's screen for a long time before he answered it, because it was, he realized with a small and unexpected ache, the first time in three weeks that anyone on either side of this — not his wife, not his colleagues, not even himself in his own private reckoning — had actually asked him that directly, rather than asking what he knew or what he'd found or what he planned to do next. *I don't know yet,* he wrote back, honestly. *I think that depends on what I do next, and I haven't decided that yet either.*\n\nAcross the city, in her own apartment stacked eleven high above a street with no visible sky, Wren had been watching this exchange unfold in the shared ledger's activity log — not the content, which remained end-to-end encrypted even from her, but the metadata, the timing, the fact that Halcyon-9 had suddenly gone from terse and infrequent to long and urgent within the span of a single day. She didn't know yet what had changed. She knew, from years of watching sources' behavior shift under pressure, that something had, and that whatever it was had moved the entire investigation's center of gravity closer to a cliff edge than it had been that morning.\n\nShe opened a new entry in the ledger, addressed to no one in particular and everyone in the Collective simultaneously, the way all entries in a leaderless archive necessarily were: *Source H9's risk profile appears to have changed significantly in the last 24 hours. Recommend increased operational security across all channels touching this thread. If H9 goes dark, that is not necessarily a signal of compromise — it may be a signal of survival. Do not escalate publicly on their behalf without explicit confirmation it's safe to do so.*\n\nIt was, she thought, typing it, exactly the kind of note the old Laughing Man legend had never had to worry about, because the legend had never been a real person with a real spouse asleep in the next room and a real badge that could be revoked and a real body that could be arrested. The show had gotten to have its cake — a leaderless movement, powerful precisely because no single person could be caught and broken — without ever having to sit with the cost carried by the actual, singular, fragile human beings who made up any real version of that movement. She was starting, three days into reading forty gigabytes of other people's patient archival labor, to understand that cost in a way the fiction had only ever gestured at.\n\nDesmond, for his part, closed his terminal that night without deciding anything further, without a plan, without a next step beyond simply getting through the following day at a job that no longer felt like the job he'd started eleven years earlier. He lay awake beside his sleeping wife, listening to the building's familiar hum, and found himself thinking, with an unexpected and almost embarrassing sentimentality, of a mask with a laughing face on it — an old fictional symbol he'd half-forgotten he still remembered — and the particular, terrifying freedom of an identity that could be shared, distributed, made survivable by never belonging entirely to any one frightened, singular person.\n\nHe did not yet know whether he wanted that freedom, or whether he even believed it was real, or whether — like so much else in this story he was now unmistakably a part of — it was simply the most comforting shape available to a man staring down a decision his conscience wouldn't let him fully back away from anymore.\n\n---\n\n### ACT V — Three Cities, One Clock (Multi-POV Close)\n\nBy the following morning, none of the three had spoken to each other directly, and none of them fully understood how tightly their separate threads had already braided together — Wren's falsification-resistant hypothesis sitting in a ledger she trusted more than any single person; Marlowe's carefully worded, deliberately patient message sitting unanswered in a relay that might or might not still be safe; Desmond's forty-minute confession sitting, now irreversibly, on servers he had no way of ever fully deleting from, no matter how end-to-end the encryption promised to be.\n\nWhat connected them, more than any shared identity or shared plan, was a clock none of them controlled and none of them could see the face of — the slow, patient, well-funded countdown toward whatever moment \"Evidentiary Readiness\" actually meant to become ready *for.* Somewhere above all three of their pay grades, in rooms none of them would ever be invited into, that countdown was being measured in hardware specifications, error-correction thresholds, and qubit-coherence milestones that none of the three of them, for all their separate expertise, had full visibility into.\n\nWren understood the countdown as a technical problem: a race between the world's cryptographic defenses and the world's cryptographic offenses, whose outcome would determine not whether the archive's contents eventually became readable, but merely *when*, and *who* would be standing closest to the door when it opened. Marlowe understood it as a disclosure problem: a story that could be told responsibly only if she got ahead of the moment it became undeniable, rather than scrambling to explain it after the fact to a public that would, by then, already have decided what it believed. Desmond understood it, now, as a moral problem he had personally and irreversibly stepped inside of, no longer a spectator to a company's slow accumulation of secrets but a participant in whatever came of exposing them.\n\nNone of the three would have called what they were building a movement. Movements, in the old sense, had rallies, manifestos, leaders willing to put a face to a cause. What the three of them were building, without any of them fully choosing to, was something closer to what the old story had always insisted was more dangerous and more durable than any single movement could be: a pattern, replicated independently by people who had never coordinated and might never meet, converging on a shape that no one of them could have assembled alone and that all of them together still couldn't fully see the edges of.\n\nThe Miroderma spiral kept glowing over the city that night, as it had every night for years, patient and unblinking, advertising regeneration and renewal to a public that had no idea the company's own name had quietly come to mean something closer to *containment* inside a handful of rooms most of its own employees would never be cleared to enter.\n\nSomewhere in a federal office whose name appeared on no public organizational chart, a quarterly report was filed, noting unremarkable progress on schedule, one line among hundreds, utterly indistinguishable from the thousands of other quarterly reports filed that same week across the sprawling, mostly boring machinery of institutional government — the kind of document that would mean nothing to anyone who found it, right up until the specific day it meant everything.\n\nWren went back to reading the forty gigabytes she'd only begun to process, understanding now that she was reading not just a company's leaked history but the shape of a countdown someone else had already started without asking anyon
