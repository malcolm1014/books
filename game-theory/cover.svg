<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#170a2e"/>
      <stop offset="100%" stop-color="#05030d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- scanlines -->
  <g opacity="0.12">
    <rect x="0" y="0" width="1200" height="630" fill="url(#scan)"/>
  </g>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000"/>
  </pattern>
  <rect x="0" y="0" width="1200" height="630" fill="url(#scan)" opacity="0.35"/>

  <!-- pixel heart sprite, lower right -->
  <g transform="translate(950,400)" fill="#f472b6">
    <rect x="0" y="20" width="20" height="20"/>
    <rect x="60" y="20" width="20" height="20"/>
    <rect x="-20" y="40" width="20" height="20"/>
    <rect x="0" y="40" width="20" height="20"/>
    <rect x="20" y="40" width="20" height="20"/>
    <rect x="40" y="40" width="20" height="20"/>
    <rect x="60" y="40" width="20" height="20"/>
    <rect x="80" y="40" width="20" height="20"/>
    <rect x="0" y="60" width="20" height="20"/>
    <rect x="20" y="60" width="20" height="20"/>
    <rect x="40" y="60" width="20" height="20"/>
    <rect x="60" y="60" width="20" height="20"/>
    <rect x="20" y="80" width="20" height="20"/>
    <rect x="40" y="80" width="20" height="20"/>
  </g>

  <!-- D20-ish diamond -->
  <g stroke="#22d3ee" stroke-width="2" fill="none" opacity="0.5">
    <polygon points="1050,60 1120,110 1090,190 1010,190 980,110"/>
  </g>

  <text x="80" y="140" font-family="'Courier New', monospace" font-size="20" fill="#22d3ee" letter-spacing="3" font-weight="700">PRESS START</text>
  <text x="78" y="230" font-family="'Courier New', monospace" font-size="54" fill="#f8fafc" font-weight="700">GAME THEORY</text>
  <text x="80" y="290" font-family="'Courier New', monospace" font-size="24" fill="#f472b6" font-weight="700">A LOVE STORY, PATCHED IN 15 CHAPTERS</text>
  <text x="80" y="340" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">A guarded game designer, and the woman who builds a whole game to find him.</text>
  <text x="80" y="560" font-family="'Courier New', monospace" font-size="18" fill="#64748b">MALCOLM R. SMITH // INTERACTIVE EDITION</text>
</svg>
