space;font-size:13px;color:rgba(0,229,255,0.38);letter-spacing:3px\">ROLL FOR INITIATIVE<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;height:1px;background:linear-gradient(to left,transparent,rgba(0,229,255,0.22))\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- CH 15 -->\n    <div id=\"ch15\">\n      <div style=\"font-family:'VT323',monospace;font-size:18px;color:#ff6ec7;letter-spacing:5px;margin-bottom:8px\">CHAPTER 15<\u002Fdiv>\n      <h2 style=\"font-family:'Press Start 2P',monospace;font-size:clamp(9px,1.3vw,12px);color:#00e5ff;line-height:1.9;letter-spacing:1px;margin:0 0 36px\">The Lifelong Campaign<\u002Fh2>\n      <div style=\"font-family:'Lora',Georgia,serif;font-size:17px;line-height:1.85;color:#c8c8a4\">\n        <p style=\"margin:0 0 22px;text-wrap:pretty\">Two years later, the house on the Hernando County marsh was alive with the sound of laughter, rolling dice, and the synchronized clack of twin mechanical keyboards.<\u002Fp>\n        <p style=\"margin:0 0 22px;text-wrap:pretty\">Adelle and Theo's wedding had been a legendary event in the local tech and gaming communities—a beautiful blending of trans tech pioneers, open-source developers, and lifelong tabletop gamers. Hunter had served as best man, naturally, wearing a custom-tailored suit with a twenty-sided die pinned to his lapel.<\u002Fp>\n        <p style=\"margin:0 0 22px;text-wrap:pretty\">Now, sitting at a massive, custom-built oak desk that spanned the length of their shared home office, the married couple worked side by side. On Theo's side of the desk lay a legal notepad, a fountain pen, and a glass of juice—his full creation mode fully active. On Adelle's side was a cutting-edge workstation running a completely open-source, automated narrative design suite.<\u002Fp>\n        <p style=\"margin:0 0 22px;text-wrap:pretty\">They weren't just playing games anymore; they were creating them together. They had launched a specialized, non-profit development studio dedicated to teaching coding and system design to queer and neurodivergent youth, providing the same digital sanctuary to the next generation that had once saved Adelle.<\u002Fp>\n        <p style=\"margin:0 0 22px;text-wrap:pretty\">Theo paused his typing, looking over at his wife. She was deep in the zone, her fingers moving like a concert pianist across the keys as she optimized a new procedural algorithm for their upcoming tabletop-digital hybrid RPG.<\u002Fp>\n        <p style=\"margin:0 0 22px;text-wrap:pretty\">\"Hey, Adelle?\" Theo asked softly.<\u002Fp>\n        <p style=\"margin:0 0 22px;text-wrap:pretty\">\"Hmm?\" she murmured, not taking her eyes off the terminal, though a fond smile played at the corner of her lips.<\u002Fp>\n        <p style=\"margin:0 0 22px;text-wrap:pretty\">\"What's the difficulty check to keep a brilliant software engineer in love with you for the rest of your life?\"<\u002Fp>\n        <p style=\"margin:0 0 22px;text-wrap:pretty\">Adelle finally paused her typing. She turned her chair around, her eyes shining with the same fierce, romantic intellect that had built Aletheia. She reached over, taking his hand and pressing it against her heart.<\u002Fp>\n        <p style=\"margin:0 0 22px;text-wrap:pretty\">\"There is no dice roll for this campaign, Theo,\" Adelle smiled, pulling him close. \"The logic is static. We're running on a permanent loop.\"<\u002Fp>\n        <p style=\"margin:0 0 22px;text-wrap:pretty\">Behind them, the sun dipped below the Florida horizon, casting a warm, pixel-perfect gold across the room. The blueprint of a soul had been drawn, compiled, and executed flawlessly. The campaign was infinite, and they had all the time in the world to play it.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- THE END -->\n    <div style=\"text-align:center;padding:80px 0 40px;margin-top:60px;border-top:1px solid rgba(0,229,255,0.12)\">\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:32px;margin-bottom:32px\">\n        <svg width=\"60\" height=\"68\" style=\"filter:drop-shadow(0 0 10px rgba(0,229,255,0.55))\"><use href=\"#d20\"><\u002Fuse><\u002Fsvg>\n        <div style=\"font-family:'Press Start 2P',monospace;font-size:clamp(10px,2.2vw,20px);color:#00e5ff;text-shadow:0 0 20px rgba(0,229,255,0.6),0 0 60px rgba(0,229,255,0.2);letter-spacing:3px\">[ THE END ]<\u002Fdiv>\n        <svg width=\"60\" height=\"68\" style=\"filter:drop-shadow(0 0 10px rgba(0,229,255,0.55))\"><use href=\"#d20\"><\u002Fuse><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:center;gap:32px;margin-bottom:20px\">\n        <svg width=\"50\" height=\"80\" style=\"image-rendering:pixelated;filter:drop-shadow(0 0 10px rgba(78,205,196,0.6))\"><use href=\"#f1\"><\u002Fuse><\u002Fsvg>\n        <div style=\"font-family:'VT323',monospace;font-size:18px;color:rgba(255,110,199,0.5);letter-spacing:4px\">GAME OVER · INSERT COIN<\u002Fdiv>\n        <svg width=\"50\" height=\"80\" style=\"image-rendering:pixelated;filter:drop-shadow(0 0 10px rgba(199,21,133,0.6))\"><use href=\"#f2\"><\u002Fuse><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-family:'VT323',monospace;font-size:14px;color:#252520;letter-spacing:3px;margin-top:12px\">A NOVEL OF CODE AND CONNECTION · © 2026<\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fmain>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  makeSVGDefs() {\n    const px = 8;\n    const sym = (id, rows, colors) => {\n      let r = '';\n      for (let ri = 0; ri < rows.length; ri++) {\n        const row = rows[ri];\n        let ci = 0;\n        while (ci < row.length) {\n          const ch = row[ci];\n          const fill = colors[ch];\n          if (!fill) { ci++; continue; }\n          let len = 1;\n          while (ci + len < row.length && row[ci + len] === ch) len++;\n          r += `<rect x=\"${ci*px}\" y=\"${ri*px}\" width=\"${len*px}\" height=\"${px}\" fill=\"${fill}\"/>`;\n          ci += len;\n        }\n      }\n      return `<symbol id=\"${id}\" viewBox=\"0 0 ${rows[0].length*px} ${rows.length*px}\">${r}<\u002Fsymbol>`;\n    };\n    const f1 = sym('f1', [\n      '..BBBB....', '.BBBBBB...', '.BWBBWB...', '.BBBBBB...', '..BBBB....',\n      '..DDDD....', 'DDDDDDDD..', 'DDHHHHHD..', 'DDHHHHHD..', '..DDDDDD..',\n      '...DD.DD..', '...DD.DD..', '...DD.DD..', '...DD.DD..', '..DDDD.DDD', '..DDDD.DDD'\n    ], { B: '#4ECDC4', D: '#0D7377', H: '#7EEDE7', W: '#FFFFFF' });\n    const f2 = sym('f2', [\n      '....PPPP..', '...PPPPPP.', '...PWPPWP.', '...PPPPPP.', '....PPPP..',\n      '....QQQQ..', '..QQQQQQQQ', '..QHHHHHQQ', '..QHHHHHQQ', '..QQQQQQ..',\n      '..QQ.QQ...', '..QQ.QQ...', '..QQ.QQ...', '..QQ.QQ...', 'QQQ.QQQQ..', 'QQQ.QQQQ..'\n    ], { P: '#FF6EB4', Q: '#C71585', H: '#FF8DC7', W: '#FFFFFF' });\n    const d20 = '<symbol id=\"d20\" viewBox=\"0 0 80 90\"><polygon points=\"40,2 78,30 78,62 40,88 2,62 2,30\" fill=\"#060618\" stroke=\"#00e5ff\" stroke-width=\"2.5\"/><line x1=\"40\" y1=\"2\" x2=\"40\" y2=\"45\" stroke=\"#00e5ff\" stroke-width=\"1\" stroke-opacity=\"0.5\"/><line x1=\"2\" y1=\"46\" x2=\"78\" y2=\"46\" stroke=\"#00e5ff\" stroke-width=\"1\" stroke-opacity=\"0.5\"/><line x1=\"40\" y1=\"2\" x2=\"2\" y2=\"30\" stroke=\"#00e5ff\" stroke-width=\"1\" stroke-opacity=\"0.4\"/><line x1=\"40\" y1=\"2\" x2=\"78\" y2=\"30\" stroke=\"#00e5ff\" stroke-width=\"1\" stroke-opacity=\"0.4\"/><line x1=\"40\" y1=\"45\" x2=\"2\" y2=\"62\" stroke=\"#00e5ff\" stroke-width=\"1\" stroke-opacity=\"0.4\"/><line x1=\"40\" y1=\"45\" x2=\"78\" y2=\"62\" stroke=\"#00e5ff\" stroke-width=\"1\" stroke-opacity=\"0.4\"/><text x=\"40\" y=\"46\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-family=\"monospace\" font-weight=\"bold\" font-size=\"20\" fill=\"#00e5ff\">20<\u002Ftext><\u002Fsymbol>';\n    return `<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"0\" height=\"0\" style=\"position:absolute;overflow:hidden\"><defs>${f1}${f2}${d20}<\u002Fdefs><\u002Fsvg>`;\n  }\n  componentDidMount() {\n    const prog = document.getElementById('prog');\n    if (!prog) return;\n    const update = () => {\n      const total = document.documentElement.scrollHeight - window.innerHeight;\n      if (total <= 0) return;\n      prog.style.width = Math.min(100, Math.round(window.pageYOffset / total * 100)) + '%';\n    };\n    window.addEventListener('scroll', update, { passive: true });\n  }\n  renderVals() {\n    return { defs: { __html: this.makeSVGDefs() } };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
